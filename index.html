-content:space-between;gap:4px;align-items:start}.cost,.rarity{background:#12192e;border:2px solid currentColor;border-radius:50%;min-width:26px;height:26px;display:grid;place-items:center;font:12px var(--pixel);color:#9deaff;flex:none}.rarity{width:15px;min-width:15px;height:15px;border-radius:3px;font:0 var(--pixel);transform:rotate(45deg);margin:4px}.rarity.common{color:#eee;background:#eee}.rarity.rare{color:#64baff;background:#64baff}.rarity.epic{color:#bb8dff;background:#bb8dff}.rarity.legendary{color:#ffab54;background:#ffab54}.art{font:49px/1 var(--display);text-align:center;margin:2px auto;color:var(--type);text-shadow:3px 3px #111}.card-name{font:17px/1.25 var(--display);color:#fff}.card-desc{font-size:11px;line-height:1.35;min-height:30px}.card-desc em{color:var(--gold);font-style:normal}.card-meta{color:var(--muted);font-size:10px;margin-top:auto}.quiz{border:2px solid var(--line);background:#1a203a;padding:10px;margin:8px 0}.quiz strong{display:block;font-size:15px;line-height:1.45;margin-bottom:8px}.options{display:grid;grid-template-columns:1fr 1fr;gap:6px}.answer{background:var(--panel2);border:2px solid var(--line);color:var(--fg);padding:7px;text-align:left;cursor:pointer;line-height:1.35;min-width:0;word-break:break-word}.answer b{font:10px var(--pixel);color:var(--gold);margin-right:5px}.answer.correct{border-color:var(--life);background:#24534d}.answer.wrong{border-color:var(--bad);background:#60364d}.answer:disabled{cursor:default}.explain{border-top:1px dashed var(--line);margin-top:8px;padding-top:7px;font-size:12px}.explain strong{color:var(--life)}.combat{padding:8px 10px 10px}.combat-top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.combat-top #energy{font:19px var(--display);color:var(--gold)}#piles{font-size:11px;color:var(--muted)}.hand{display:flex;align-items:stretch;justify-content:center;gap:5px;min-height:142px;padding:10px 2px 0;overflow:hidden}.hand .card{flex:0 1 132px;height:140px}.hand .card .art{font-size:36px}.hand.overlap .card{flex:0 0 var(--card-width,116px);margin-right:-20px}.hand.overlap .card:last-child{margin-right:0}.hand.overlap .card:hover{z-index:5;transform:translateY(-6px)}.hand .card.playable{box-shadow:0 0 0 1px var(--gold),3px 3px var(--shadow)}.relic-list{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.relic-chip,.status-chip{font-size:11px;border:1px solid var(--gold);color:var(--gold);background:#423c43;padding:2px 6px}.node-choice{min-width:100px;text-align:center;font:23px var(--display)}.deck-list{display:flex;flex-wrap:wrap;gap:5px;max-height:130px;overflow:auto}.deck-list span{padding:2px 6px;background:var(--panel2);border:1px solid var(--line);font-size:11px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:9px 0}.stat-grid div{background:var(--panel2);border:1px solid var(--line);padding:6px}.stat-grid b{display:block;font:14px var(--pixel);color:var(--gold)}.missed{max-height:160px;overflow:auto;padding-left:20px;font-size:12px}.missed li{margin:4px 0}.notice{font-size:12px;color:var(--gold)}@media(max-width:600px){.hud strong{font-size:14px}.hud>div{padding:5px}.stage{height:195px}.enemy-hud,.player-hud{font-size:10px;min-width:0}.map-wrap{padding:6px}.map-floor{gap:2px}.map-node{width:24px;height:24px;font-size:14px}.map-floor:not(:last-child):after{margin:0}.screen{padding:11px}.choice-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.options{grid-template-columns:1fr}.hand{gap:1px}.hand .card{flex:1 1 0;min-width:0;height:142px;padding:4px}.hand .card .art{font-size:27px}.hand .card-name{font-size:12px}.hand .card-desc{font-size:9px}.hand .card-meta{font-size:8px}.hand .cost{width:20px;min-width:20px;height:20px;font-size:9px}.hand.overlap .card{flex:0 0 var(--card-width,78px);margin-right:-20px}.hand.overlap .card:last-child{margin-right:0}.stat-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:360px){.hand.overlap .card{margin-right:-20px}.map-node{width:20px;height:22px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

<script>const QUESTIONS={"1":[{"anchor":"1-1","q":"打车坐在后排，朋友说后排不用系安全带。哪种做法更稳妥？","o":["系安全带，前排后排都系","只坐几站路，抓稳扶手就行","后排没有撞击风险，不系也行","车速慢时只让前排系"],"why":"坐前排系上安全带，出车祸时被撞死的概率大约降一半。坐轻型卡车前排的降六成。"},{"anchor":"1-2","q":"骑电动车去附近超市，头盔该怎么戴？","o":["骑摩托车、电动自行车戴头盔并扣好","挂在车把上，遇到检查再戴","戴在头上但不用扣带","低速短途完全不用戴"],"why":"戴头盔并且把扣带扣好，摩托车骑手出事时死亡的概率低约四成。头部受伤低约七成。"},{"anchor":"1-3","q":"新租的房子没有报警器，冬天还用燃气取暖。你会怎么做？","o":["装烟雾报警器；冬天在室内烧煤、用燃气取暖的再装一氧化碳报警器","闻到烟味再开窗就够了","只装摄像头，不用烟雾报警器","夜里人会自然闻到烟味醒来"],"why":"一个能正常工作的烟雾报警器，能把住宅火灾里死亡的概率降约六成。起火时有四成人在睡觉，光靠鼻子是醒不过来的。"},{"anchor":"1-4","q":"生活里遇到「燃气软管」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["燃气软管和灶具到期就换，不自己改管道，燃气公司上门推销可以直接拒绝","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"一根合规软管几十块。到期就换，这是《城镇燃气管理条例》写明的用户义务。"},{"anchor":"1-5","q":"家人在山里采到不认识的蘑菇，说虫子吃过就安全。你怎么办？","o":["不采、不买、不吃野生蘑菇，任何「土办法鉴别」都不成立","先用银针试毒再吃","和大蒜同煮，变色就扔掉","颜色不鲜艳就可以吃"],"why":"光 2025 年一年，全国就有 828 起蘑菇中毒，2165 人中招，13 人死。那一年还新认出 34 种以前没记录过会毒人的蘑菇。"},{"anchor":"1-6","q":"邻居想把电动车推进高层住宅楼道充电。哪种处理更安全？","o":["电动自行车不推进楼道、不进电梯、不在家里充电","充电时有人看着就可以","停在电梯口不挡路即可","只充半小时就没有风险"],"why":"把电动车推进楼道、推进电梯，或者在家里充电，应急管理部的《高层民用建筑消防安全管理规定》明令禁止。不改正的，个人罚 500 到 1000 元，做生意的罚 2000 到 10000 元。"},{"anchor":"1-7","q":"生活里遇到「血压」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["量血压，高了就吃药降到达标","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"血压每降 10 mmHg，出大的心血管毛病的概率降两成，中风降 27%，心衰降 28%，死亡概率降 13%。中国 35 到 75 岁的人里，44.7% 有高血压，真正控制住的只有 7.2%。"},{"anchor":"1-8","q":"生活里遇到「空腹血糖」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["35 岁以后只要超重，就去查一次空腹血糖，正常也每三年再查","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"花几十块抽一管血，就能在一点症状都没有的时候查出糖尿病前期。美国官方的筛查建议是：35 到 70 岁、超重或肥胖的人去查。"},{"anchor":"1-9","q":"生活里遇到「超速」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["开车不超速、不酒驾","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"平均车速每高 1%，撞死人的概率高约 4%。酒精没有「喝一点没事」的安全线。"},{"anchor":"1-10","q":"生活里遇到「给 4 岁以下儿童用」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["给 4 岁以下儿童用安全座椅，不要抱在怀里","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"一岁以下的婴儿坐安全座椅，车祸里受致命伤的概率低约七成。1 到 4 岁的孩子低约一半。"},{"anchor":"1-11","q":"生活里遇到「窗户」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["家里有小孩就给窗户和阳台装限位器，纱窗不算防护","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"一副限位器几十块钱。纽约市给高风险住户免费装窗户护栏、又上门讲解，一个区上报的儿童坠落数三年里降了一半。"},{"anchor":"1-12","q":"生活里遇到「儿童近水」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["儿童近水不离视线，划船、野泳穿救生衣","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"落水的时候穿着救生衣，淹死的概率大约只有不穿的一半。溺水至今是中国 1 到 14 岁孩子的头号死因。"},{"anchor":"1-13","q":"生活里遇到「平衡」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["60 岁以上练平衡和腿部力量，改造家里的浴室和楼梯","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"每周练两三次平衡，比如太极，老人跌倒的次数降约两成三，摔过的人数降 15%。家里做防滑、装扶手，再降约两成。"},{"anchor":"1-14","q":"生活里遇到「乙肝」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["查乙肝两对半，没有抗体就打疫苗","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"查一次几十块。启东那项跟踪了 30 年的试验里，一出生就打了乙肝疫苗的人，后来得原发性肝癌的概率低 84%，身上带着乙肝病毒的比例低 72%。"},{"anchor":"1-15","q":"生活里遇到「破伤风」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["被铁钉、木刺扎到或者伤口沾了泥土，当天去处理，顺便问破伤风要不要打","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"破伤风一旦发病，大约每 10 个人里死 1 个。深的伤口、沾了泥土的伤口风险最高。"},{"anchor":"1-16","q":"生活里遇到「HPV 疫苗」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["女性接种 HPV 疫苗，越早越好","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"瑞典 167 万女性的数据里，17 岁以前打过 HPV 疫苗的人，后来得浸润性宫颈癌的概率只有没打的约八分之一。17 到 30 岁才打的，也只有一半左右。"},{"anchor":"1-17","q":"生活里遇到「乳腺癌筛查」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["女性 40 岁起做乳腺癌筛查，每两年一次钼靶","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"40 到 74 岁的女性每两年拍一次钼靶，这是美国官方筛查建议里明确推荐的。75 岁以上，以及给致密乳腺加做超声和磁共振，官方的结论是证据还不够。"},{"anchor":"1-18","q":"生活里遇到「宫颈癌筛查」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["30 岁以上女性做宫颈癌筛查，优先 HPV 检测","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"印度农村那项试验里，一辈子只做过一次 HPV 检测的女性，死于宫颈癌的概率低约一半，查出晚期宫颈癌的概率低约五成。一次一两百块，结果阴性能管 5 年。"},{"anchor":"1-19","q":"生活里遇到「结直肠癌筛查」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["45 到 50 岁起做结直肠癌筛查，做查大便隐血的粪便免疫化学检测或者肠镜","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"每一两年做一次几十块的粪便隐血检查，死于结直肠癌的概率低约 16%，至少查过一轮的人低 25%。被叫去做一次肠镜的人，往后十年得结直肠癌的概率从 1.20% 降到 0.98%。"},{"anchor":"1-20","q":"生活里遇到「流感疫苗」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["有心血管病的人和老年人每年打流感疫苗","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"心梗之后打流感疫苗的那项试验里，一年内死亡的比例从 4.9% 降到 2.9%。有心血管病的人和老人，每年秋天补一针，50 到 150 元。"},{"anchor":"1-21","q":"生活里遇到「带状疱疹疫苗」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["50 岁以后打带状疱疹疫苗","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"三期试验里，这支疫苗把带状疱疹挡掉了 97%，各个年龄段都差不多。缺点是两针三四千元全自费。"},{"anchor":"1-22","q":"生活里遇到「肺炎球菌疫苗」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["65 岁以上打肺炎球菌疫苗","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"8.45 万老人的试验里，13 价肺炎球菌疫苗把疫苗管得住的那几型肺炎挡掉约 46%，把最凶险的侵袭性感染挡掉 75%。但对「所有原因的肺炎」没看出效果，别指望它管住全部肺炎。"},{"anchor":"1-23","q":"生活里遇到「幽门螺杆菌」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["查幽门螺杆菌，阳性就根除","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"山东临朐那项跟踪了 22 年的试验里，把幽门螺杆菌根除掉的人，后来得胃癌的概率低约一半，死于胃癌的概率低约四成。查一次一两百块，根除要吃两周药。"},{"anchor":"1-24","q":"生活里遇到「胸部 CT」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["重度吸烟者每年做一次低剂量胸部 CT","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"符合条件的重度吸烟者每年做一次低剂量 CT，死于肺癌的概率比只拍胸片低 20%，总的死亡概率低 6.7%。代价是查出可疑结果后的复查，和那一段时间的提心吊胆。"},{"anchor":"1-26","q":"生活里遇到「灭火器」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["备齐灭火器、灭火毯、逃生呼吸面罩和急救包，每年检查一次","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"灭火器、灭火毯、逃生面罩、急救包，都在应急管理部那份 11 样的家庭应急清单里。一套几百元，买一次就行。"},{"anchor":"1-27","q":"生活里遇到「尿里」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["尿里出现肉眼看得见的血，哪怕不疼、哪怕第二天就干净了，也要去查一次","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"60 岁以上的人出现一次肉眼看得见的血尿，最后查出膀胱癌的概率约 2.8%，40 到 59 岁约 1.2%。这个数不算高，但也高到必须去查一次。"},{"anchor":"1-36","q":"生活里遇到「金属件」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不捡、不拆、不卖来路不明的金属件，带三叶草警示标志的离远点","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"辐射没有气味、颜色和温度，多数放射源就是一截普通金属，所以「看着没事」不能当判断。普通人撞上的概率极低，每年每万枚放射源出事不到 1 起。"},{"anchor":"1-39","q":"生活里遇到「骨密度」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["65 岁以上的女性去做一次双能 X 线骨密度检查，绝经后有骨质疏松危险因素的不用等到 65 岁","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"65 岁以上的女性，以及绝经后有骨质疏松危险因素的女性，该去查一次骨密度。先查风险、再给高风险的人用药，髋部骨折能少约 17%。"},{"anchor":"1-40","q":"生活里遇到「骨质疏松」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["查出骨质疏松，或者轻轻一摔就骨折过，就请医生开抗骨质疏松药并坚持用，别拿补钙代替","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"已经确诊骨质疏松、或者轻轻一摔就骨折过的人，按医生的方案用药，髋部骨折能少约一半，脊柱骨折也少一半多。髋部骨折做完手术就开始每年输一次药的老人，两年里再骨折的少约三成五。"},{"anchor":"1-41","q":"朋友约你去野外湖面冰钓，冰看起来很结实。你会怎么判断？","o":["上野外冰面前先打孔量厚度，不到 15 厘米别上，河上的冰和冰钓洞边别去","只看表面颜色和脚感","跟着前一个人走就安全","河上的冰和湖面一样可靠"],"why":"国内官方的说法是，冰厚到 15 厘米，成年人才能上去滑冰。美国和加拿大的底线是 10 厘米，而且只算新结的透明冰。"},{"anchor":"1-42","q":"生活里遇到「角磨机」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["装好护罩、戴上护目镜加面屏再用角磨机，双手握稳，别装木工锯片切木头","等出现明显症状或事故后再处理","只听亲友的经验，不必核实具体风险","买最贵的产品就够了，使用方式不重要"],"why":"角磨机转得极快，片子碎了会飞出来伤人，装上木工锯片还会突然反弹。国内两起事故都是装了锯片、没装护罩，一人割断大腿动脉，一人割破颈动脉，都没救回来。"},{"anchor":"2-1","q":"朋友想降低长期健康风险，却一直抽烟。你会建议什么？","o":["戒烟，越早越好","换成低焦油烟就够了","只在周末抽就没有风险","等身体出现症状再考虑"],"why":"吸烟的人平均比不吸烟的人少活十年以上。40 岁前戒掉，能把接着吸烟带来的死亡风险抹掉九成左右。"},{"anchor":"2-2","q":"生活里遇到「别在家里和车里抽烟」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["别在家里和车里抽烟，也别让客人在家里抽","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"全球每年约 60 万人死于吸别人的烟，其中近三成是孩子。长期吸二手烟的人，高血压、心脏病、卒中的风险都高三成上下。"},{"anchor":"2-3","q":"生活里遇到「戒烟」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["戒烟别光靠忍，先去拿药：成功率能翻一倍多","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"光靠忍，多数人戒不掉。吃伐尼克兰的人戒成的比例，是吃安慰剂的两倍多。"},{"anchor":"2-4","q":"生活里遇到「戒烟」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["定一个戒烟日，到那天一次停掉，别先慢慢减","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"很多人打算先每天少抽几根，慢慢减到零。可到了第六个月，定好日子一次停掉的人里 22% 没再抽，慢慢减的只有 15.5%。"},{"anchor":"2-5","q":"生活里遇到「戒烟」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["去戒烟门诊，或者打 12320 问当地有没有戒烟服务","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"药和「有人定期问你」是两件事，合起来最管用。一边吃药一边有专人跟进的人，戒成的比例接近只听一句简短建议的人的两倍。"},{"anchor":"2-6","q":"生活里遇到「电子烟」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["已经戒不掉再考虑电子烟，本来不吸烟的人别碰","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"把烟换成含尼古丁的电子烟，戒成的人比用尼古丁贴片多约六成，这个结论很可靠。但它不是无害的，长期吸的安全数据还没有。"},{"anchor":"2-7","q":"生活里遇到「含糖饮料」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不喝含糖饮料，换成无糖的也不算解决","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"每天喝两瓶以上甜饮料的人，同期死亡的概率比几乎不喝的人高约两成。每天一到两瓶的，也高一成多。"},{"anchor":"2-8","q":"生活里遇到「槟榔」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不嚼槟榔","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"嚼槟榔的人，同期死亡的概率比不嚼的人高约两成。糖尿病和代谢综合征的风险高近五成。"},{"anchor":"2-9","q":"生活里遇到「低钠盐」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["把家里的食盐换成低钠盐（钾盐）","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"得过中风或 60 岁以上有高血压的人，把家里的盐换成低钠盐，五年内死亡的概率低约 12%，中风低约 14%。"},{"anchor":"2-10","q":"生活里遇到「刷牙」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["认真刷牙，每天清一次牙缝，缺牙及时补","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"每天用牙线或牙缝刷的人，同期死亡的概率低约一成。牙掉光的老人，死亡的概率高约九成。"},{"anchor":"2-11","q":"你想把走路变成稳定的健康习惯，怎样设目标更合理？","o":["每天走到 7000–8000 步，或者每周累计快走 150–300 分钟","每周只在一天走很远","只记录步数，不管平时活动","偶尔暴走就能抵消久坐"],"why":"每天走 7800 步左右的人，同期死亡的概率比只走 3500 步的人低约四成半。按时间算也一样，每周快走 150–300 分钟，比不运动低约三成。"},{"anchor":"2-12","q":"生活里遇到「高血压」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["有高血压、高血脂就按医嘱规律吃药，别自行停","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"血压每降 10 mmHg，死亡的概率降约 13%，中风降约 27%。他汀把低密度胆固醇降 1 个单位，死亡的概率降约一成。"},{"anchor":"2-13","q":"最近常熬夜，白天靠咖啡撑住。怎样调整作息？","o":["每晚睡 7 小时左右，作息固定","把工作日缺的觉全攒到周末","睡前再喝咖啡提神","每天睡四五小时也算规律"],"why":"长期睡不到 7 小时的人，同期死亡的概率高约一成。作息越乱，风险越高。"},{"anchor":"2-14","q":"生活里遇到「球拍类运动」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["常打网球、羽毛球、乒乓球这类球拍类运动","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"常打网球、羽毛球、乒乓球的人，同期死亡的概率比不打的人低约一半，心血管死亡低约 56%。游泳的人低约 28%。"},{"anchor":"2-15","q":"生活里遇到「爬楼梯」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["把爬楼梯、快走赶路这类零碎的用力活动攒到每天四五分钟","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"平时完全不锻炼的人，只要每天有三次一两分钟的用力活动，同期死亡的概率就比一点没有的人低约四成，心血管死亡低近一半。用力活动指爬楼梯、快步赶路这类。"},{"anchor":"2-16","q":"生活里遇到「力量训练」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["每周做 30–60 分钟力量训练","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"每周练 30–60 分钟力量的人，同期死亡的概率比不练的人低一到两成。再多练不会更好。"},{"anchor":"2-17","q":"生活里遇到「别连着坐太久」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["别连着坐太久，隔一阵起身动一动","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"坐得最久的人，同期死亡的概率是坐得最少的人的 2.6 倍。一次连着坐很久，还要另算一笔风险。"},{"anchor":"2-18","q":"生活里遇到「加工肉」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["少吃加工肉（火腿、培根、香肠、午餐肉）","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"火腿、培根、香肠吃得最多的人，同期死亡的概率比吃得最少的人高约两成。每天多吃一份加工肉，概率也高两成。"},{"anchor":"2-19","q":"生活里遇到「喝酒」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["少喝或不喝酒","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"每周喝过 100 g 纯酒精以后，喝得越多死得越早。100 g 纯酒精大约是 2.5 L 啤酒。"},{"anchor":"2-21","q":"生活里遇到「喝酒」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["想少喝酒，先把一周喝了多少数出来，再找医生聊几分钟","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"医生花几分钟看你的饮酒量、说清风险、帮你定个目标，一年后平均每周少喝 20 克纯酒精，大约半升啤酒。谈更久并没有更多好处。"},{"anchor":"2-22","q":"生活里遇到「坚果」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["每天吃一小把坚果","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"常吃坚果的人，同期死亡的概率比不吃的人低约两成。一周吃一次就能看出差别，低约一成。"},{"anchor":"2-23","q":"生活里遇到「红肉」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["把一部分红肉换成鱼和禽肉","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"每周多吃两份加工肉或者红肉，同期死亡的概率高约 3%。换成同样份数的鱼或者禽肉，就看不出升高。"},{"anchor":"2-24","q":"生活里遇到「全谷物」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["把一部分精米白面换成全谷物","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"每天多吃 90 g 全谷物的人，同期死亡的概率低约 17%。90 g 大约是三份。"},{"anchor":"2-25","q":"生活里遇到「每周喝三次以上茶」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["每周喝三次以上茶","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"有喝茶习惯的人，同期死亡的概率低约 15%。从 50 岁算起，平均多活 1.26 年，多出 1.41 年不得心血管病的时间。"},{"anchor":"2-26","q":"生活里遇到「咖啡」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["每天喝三到四杯咖啡，不加糖不加奶盖","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"每天喝三到四杯咖啡的人，同期死亡的概率比不喝的人低约 17%。"},{"anchor":"2-27","q":"生活里遇到「水果蔬菜」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["每天吃够 5 份（约 400 g）水果蔬菜","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"每天多吃 200 g 蔬菜水果，同期死亡的概率低约一成。每天吃够 5 份的人，比只吃 2 份的人低约 13%。"},{"anchor":"2-28","q":"生活里遇到「超加工食品」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["少吃超加工食品（薯片、方便面、糕点、速食）","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"超加工食品吃得最多的人，同期死亡的概率比吃得最少的人高约两成，心血管死亡高五成。不过这类证据被评为不太确定，数字要往回打折看。"},{"anchor":"2-29","q":"生活里遇到「烧煤」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["做饭、取暖不烧煤和柴，换成电或燃气","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"做饭烧煤或烧柴的人，同期死亡的概率高约一成；取暖烧煤柴的高约 14%。已经改用电或燃气的人，比还在烧煤柴的人死亡概率低 13%–33%。"},{"anchor":"2-30","q":"生活里遇到「咖啡」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["热的东西放一放再喝，不喝滚烫的茶、汤和咖啡","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"喝很烫的茶，得食管癌的概率是喝温茶的 8 倍。就算只是「热」，也有 2 倍。"},{"anchor":"2-31","q":"生活里遇到「晒太阳」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["白天出门晒晒太阳，别整天不见光","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"刻意躲太阳的女性，预期寿命比晒得最多的人少 0.6 到 2.1 年。不吸烟但躲太阳的人，寿命和晒得最多的吸烟者差不多。"},{"anchor":"2-32","q":"生活里遇到「BMI」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["把 BMI 控制在 20–25，超重就减","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"死亡的概率在 BMI 20–25 这一段最低。BMI 到 27.5–30 高约两成，30–35 高约四成半，35–40 接近翻倍。"},{"anchor":"2-34","q":"生活里遇到「奶或酸奶」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["每天喝一两份奶或酸奶","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"每天喝两份以上奶或者酸奶的人，同期死亡的概率比不喝的人低约 17%。"},{"anchor":"2-35","q":"生活里遇到「鸡蛋」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["鸡蛋不用戒，但别每天三四个","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"每天多吃半个全蛋，同期死亡的概率高约 7%。把这半个换成蛋清、鱼、禽肉或者坚果，各项死亡风险反而都更低。"},{"anchor":"2-36","q":"生活里遇到「泡澡」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["有条件就泡澡，别只冲淋浴","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"几乎每天泡澡的人，心血管事件的风险比每周泡不到两次的人低约 28%，脑出血低约 46%。"},{"anchor":"2-37","q":"生活里遇到「午睡」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["把午睡控制在半小时内，别超过一小时，非得睡一两小时才撑得住就去查原因","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"午睡不超过一小时的人，死亡和慢性病的风险没有升高，脑子还更清醒一些。睡过一小时的人，冠心病风险高约三成，糖尿病和肥胖高约两成。"},{"anchor":"2-38","q":"生活里遇到「熬夜」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["熬夜之后第二天晚上就补觉，别攒到周末","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"少睡之后第二天晚上没补上的人，死亡风险比作息规律的人高约 15%，少得厉害又不补的高约 42%。补上了的人看不出风险升高。"},{"anchor":"2-39","q":"生活里遇到「夜班」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["上夜班干得越久心血管风险越高，能转岗就趁早转","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"上夜班的人，心血管病比不上夜班的人多约 13%，心血管死亡多约 27%。而且干得越久越多：每多上 5 年夜班，心血管病再多约 7%。"},{"anchor":"2-40","q":"生活里遇到「食用油」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["买预包装、有 SC 编号的食用油，不买小作坊散装自榨花生油","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"花生受潮发霉会长黄曲霉毒素，它是明确的致癌物，主要伤肝。广州管住小作坊之后，常吃自榨油的居民肝功能异常少了约三成半。"},{"anchor":"2-41","q":"生活里遇到「做饭用植物油代替猪油」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["做饭用植物油代替猪油和黄油，不必为了健康换着买油，也别指望亚麻籽油护心","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"少吃猪油黄油这类饱和脂肪、换成植物油，心脏病和中风这类事少约一成七，但总的死亡风险没看出变化。大豆油、玉米油、菜籽油之间换来换去，没有证据说有什么区别。"},{"anchor":"2-42","q":"生活里遇到「抽油烟机」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["炒菜、煎炸时打开抽油烟机，从开火一直开到做完","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"不吸烟的中国女性，炒菜时不开或很少开抽油烟机，得肺癌的风险约是常开的两倍。住过厨房通风差的房子，风险也高约五成，烧煤的人家最明显。"},{"anchor":"2-44","q":"生活里遇到「走路」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["本来就想养狗的，把每天遛狗算进走路量，别为了长寿专门去养狗","偶尔集中做一次就能抵消平时的习惯","只看广告宣传，不看持续做法","身体没有不适就完全不用管"],"why":"养狗的人同期死亡的概率平均低约四分之一，心梗、中风之后养狗的人低得更多。但扣掉其他差别以后，英国和挪威的大研究都看不出差别，养猫也看不出关联。"},{"anchor":"13-1","q":"有人倒地而且没有正常呼吸，周围有 AED。你第一步该做什么？","o":["有人倒地没呼吸，立刻用力按压胸口，让旁人打 120 并找 AED","先喂水看能不能醒","把人扶起来走一走","等家属赶来再叫救护车"],"why":"你最可能按的是自家人：心脏骤停有 79.2% 发生在家里。有人按压，活着出院的比例从 3.9% 升到 16.1%。"},{"anchor":"13-2","q":"现场情况：老人摔倒、有人倒地。你会怎么处理？","o":["老人摔倒、有人倒地，先蹲下喊他、打 120，别急着把人扶起来；陌生人这档走开也合法，停下来就别上手搬","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"这条的主线是自家老人和身边熟人。先看有没有呼吸，没有就按第 1 条（用力按压胸口）压胸。"},{"anchor":"13-3","q":"家人突然嘴歪、手臂没力、说话含糊。你怎么办？","o":["突然嘴歪、一侧胳膊没劲、说话说不清，立刻打 120，不要等、不要自己开车去","让他睡一觉再观察","自己开车送医院，不打急救电话","先吃点降压药等症状消退"],"why":"嘴歪、一侧胳膊抬不起、说话说不清，立刻打 120。发病 3 小时内打药通开血管，恢复到生活基本能自理的可能性大约是不打药的 1.75 倍。"},{"anchor":"13-4","q":"现场情况：突然天旋地转站不稳、看东西成双、一只眼发黑。你会怎么处理？","o":["突然天旋地转站不稳、看东西成双、一只眼发黑，或者手指点不到自己鼻尖，也按卒中打 120","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"只看「脸歪、抬手、说话」三条，一成多的卒中会被漏掉，因为有的卒中一开始既不歪嘴也不瘫手。把站不稳、看东西重影或缺一块也算进去，漏掉的降到 4.4%。"},{"anchor":"13-5","q":"现场情况：一只眼睛突然像拉下窗帘一样黑掉。你会怎么处理？","o":["一只眼睛突然像拉下窗帘一样黑掉，哪怕几分钟就自己好了，也当天按卒中去急诊","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"一只眼突然像拉下窗帘一样黑掉，是眼底血管堵了，堵得越久，能救回的视网膜越少。它也是脑缺血的一种，接下来几天容易中风。"},{"anchor":"13-6","q":"现场情况：一只眼又胀又痛、发红。你会怎么处理？","o":["一只眼又胀又痛、发红，看灯有一圈彩虹，还头痛恶心想吐，当天去眼科急诊","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"这是青光眼急性发作。眼睛里的水排不出去，眼压一下子顶上去。"},{"anchor":"13-7","q":"现场情况：胸口压着疼、闷、发紧超过 15 分钟不缓解。你会怎么处理？","o":["胸口压着疼、闷、发紧超过 15 分钟不缓解，打 120，不要自己扛也不要自己开车","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"胸口压着疼、闷、发紧，超过 15 分钟不缓解，打 120。到医院后 55 分钟内把血管撑开的，30 天内死亡 2.8%。"},{"anchor":"13-8","q":"现场情况：突然像被撕开一样的剧痛。你会怎么处理？","o":["突然像被撕开一样的剧痛，从胸口往后背、往腰一路挪，打 120 并说清「疼在移动」","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"撕裂一样的剧痛从胸口往后背、往腰一路挪，打 120 时直接说「像撕开一样，疼在往下走」。这病不手术、光吃药的死亡率 58%。"},{"anchor":"13-9","q":"现场情况：突然一记「这辈子最疼的头痛」。你会怎么处理？","o":["突然一记「这辈子最疼的头痛」，一小时内就到最疼，立刻去急诊做头颅 CT","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"要看的是多快疼到最厉害。一小时内疼到顶的剧烈头痛，约 6% 是脑表面的血管破了。"},{"anchor":"13-10","q":"生活里遇到「老人磕过头之后两三周」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["老人磕过头之后两三周到几个月变得走路不稳、迟钝、嗜睡或者一侧没劲，去做头颅 CT","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"老人磕头之后，血通常到第三周才积起来。撞的当时可以完全没事，人自己都想不起磕过。"},{"anchor":"13-11","q":"现场情况：一条腿突然肿起来、发紧、按着疼。你会怎么处理？","o":["一条腿突然肿起来、发紧、按着疼，尽快就医；再加上突然喘不上气或者胸痛，立刻打 120","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"一条腿突然肿起来、比另一条粗一圈、按着疼，尽快去做腿部静脉超声。再出现突然喘不上气、深吸气时胸痛、心跳快、发晕，血块可能已经跑到肺里，直接打 120。"},{"anchor":"13-12","q":"生活里遇到「大出血」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["大出血先用手死死压住伤口，四肢压不住就上止血带，同时打 120","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"先用手或衣物死死压住，四肢压不住就上止血带，再打 120，上了就不松开。战地伤员里，休克前上止血带的活了九成，休克后才上的只活一成，该上没上的 5 个人全死了。"},{"anchor":"13-13","q":"现场情况：被狗、猫咬伤或抓破皮。你会怎么处理？","o":["被狗、猫咬伤或抓破皮，先用肥皂水和流水交替冲 15 分钟，当天去打疫苗","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"狂犬病一旦发病，病死率几乎 100%，冲洗加疫苗是唯一的路。先用肥皂水和流动清水交替冲 15 分钟，当天去打疫苗。"},{"anchor":"13-14","q":"刚被热水烫伤，旁边的人拿来了牙膏。怎样处理？","o":["烫伤后立刻用凉的流动水冲 20 分钟，别抹牙膏酱油","抹牙膏给伤口降温","立刻用酱油盖住烫伤处","先戳破水泡再冲洗"],"why":"受伤 3 小时内用凉的流动水冲够 20 分钟，后来需要植皮的可能性大约只有没冲的六成。是凉水不是冰水，冰敷会加重损伤。"},{"anchor":"13-15","q":"现场情况：突然全身起疹、喘不上气或者发晕。你会怎么处理？","o":["突然全身起疹、喘不上气或者发晕，按过敏性休克处理，立刻叫 120 并说清楚","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"突然全身起疹，再加上喘不上气或者发晕，就按过敏性休克办。立刻打 120，直接说「怀疑过敏性休克」，让急救带着肾上腺素来。"},{"anchor":"13-16","q":"有人突然抽搐倒地，嘴巴紧闭。旁边人说要塞勺子。你怎么做？","o":["有人抽搐倒地，清开周围、让他侧躺、看表计时，什么都别往嘴里塞","把勺子塞进嘴里防咬舌","按住四肢阻止抽动","立刻喂水让他清醒"],"why":"把周围的硬东西挪开，让他侧躺、嘴朝下，看表记时间。别按住他，别掰嘴，别往嘴里塞东西，那只会弄伤牙齿和下颌。"},{"anchor":"13-17","q":"生活里遇到「糖尿病人突然发抖、出」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["糖尿病人突然发抖、出冷汗、说话不清，先给 15 克糖，15 分钟后复测","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"先吃 15 克糖，方糖、一小盒果汁都行。15 分钟后再测一次，还低就再来一次。"},{"anchor":"13-18","q":"现场情况：有人触电。你会怎么处理？","o":["有人触电，先断电，再用干燥的木棍之类挑开电源，不要直接上手拉","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"先断电，或者用干燥的木棍之类把电源挑开，再碰人。直接上手拉，一个伤者就变成两个。"},{"anchor":"13-19","q":"屋里报警器响了，几个人都头痛恶心。你如何应对？","o":["一氧化碳报警器响了，或者一屋子人同时头痛恶心，先出门再打电话","先在屋里给燃气公司打电话","打开电灯检查是不是误报","躺下休息等头痛过去"],"why":"报警器响了，或者一屋子人同时头痛、恶心、发晕，先把人都带到室外，再打电话。别留在屋里找原因，也别回去关阀门。"},{"anchor":"13-20","q":"现场情况：误服清洁剂、农药、药物先别催吐。你会怎么处理？","o":["误服清洁剂、农药、药物先别催吐，带上瓶子立刻就医；溅到眼睛或皮肤用大量清水至少冲 15 分钟","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"误服清洁剂、农药、药物不要催吐，腐蚀性液体吐出来会把食管再烧一遍。先喝适量牛奶或者蛋清，带上瓶子和说明书立刻去医院。"},{"anchor":"13-21","q":"生活里遇到「化学品」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["酸碱等化学品溅到身上，立刻脱掉污染的衣服、用大量流动清水冲，眼睛要掰开眼皮冲，冲够时间再走","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"三步。第一步，立刻脱掉沾上的衣服鞋袜，衣服兜住的地方伤得最重。"},{"anchor":"13-22","q":"现场情况：高温下头晕、恶心、不出汗或意识不清。你会怎么处理？","o":["高温下头晕、恶心、不出汗或意识不清，立刻挪到阴凉处脱衣泼水降温，意识不清的不喂水、打 120","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"皮肤烫红、说话含糊、意识混乱是热射病。从头晕到昏迷可以只有几十分钟，病死率极高。"},{"anchor":"13-23","q":"生活里遇到「中暑」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["中暑的人只要清醒，就少量多次喝凉的淡盐水或运动饮料，别猛灌、别喝酒和高糖饮料","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"只有清醒的人才喝。凉的淡盐水或运动饮料少量多次喝，一小时 500 到 1000 毫升。"},{"anchor":"13-24","q":"楼道起火，门外可能有浓烟。逃生时该怎么做？","o":["火灾时贴地爬、摸门再开门、门烫就别开，走楼梯不坐电梯，出去了别回头","乘电梯比走楼梯快","门很烫也要立刻打开","出去后返回屋里拿贵重物品"],"why":"趴到地上，从烟底下爬向出口。开门前先摸门把和门板，烫、或者门缝在冒烟，就别开这扇门，换第二条路。"},{"anchor":"13-25","q":"岸边有人落水，你不会水。你会怎么救援？","o":["看到有人溺水，先叫人和打 110/120，伸竿、抛漂浮物，自己不下水","马上跳下水拉人","等他自己游近再说","先站在水边伸手去抓，不叫人"],"why":"溺水的人会本能地把施救者往水下按，下水的人自己也可能淹死。顺序是：大喊叫人 → 打 110/120 → 递长杆、绳子 → 抛救生圈、空桶、矿泉水瓶 → 人上岸没呼吸就立刻按压。"},{"anchor":"13-26","q":"现场情况：有人噎住说不出话。你会怎么处理？","o":["有人噎住说不出话，站到背后做 5 次拍背加 5 次腹部冲击，倒下就做心肺复苏","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"先问「你噎住了吗，能说话吗」。还能用力咳、能出声的不要动手，让他咳。"},{"anchor":"13-27","q":"生活里遇到「在戈壁、沙漠、无人区」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["在戈壁、沙漠、无人区迷路或车坏了，留在原地或车旁，先报位置，再遮阳保温，省水，不乱走","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"留在原地或者车旁，车是最大的遮阳物。顺序是：有信号先发位置再打电话 → 遮阳保暖 → 省水，白天不动、夜里凉了再动 → 不乱走 → 用反光镜、烟、三堆火发信号。"},{"anchor":"13-28","q":"生活里遇到「失温」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["发抖、说话含糊、走路打晃是失温，换掉湿衣、包起来，先暖躯干，喝热甜饮不喝酒","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"体温降到 35℃ 以下就是失温，人会发抖、说话含糊、走路打晃、想不清楚事。换掉湿衣服，用保温毯或者干衣裹起来，先暖躯干、不先暖手脚。"},{"anchor":"13-29","q":"现场情况：被蛇咬。你会怎么处理？","o":["被蛇咬，坐下别动、摘掉戒指手表、尽快送医院打抗蛇毒血清，不切、不吸、不绑死","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"坐下别动，把被咬的肢体固定住。先摘掉戒指手表，接下来会肿。"},{"anchor":"13-30","q":"生活里遇到「地震」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["地震时先看自己在什么房子里：符合抗震设防的楼里就地躲，会垮的老房子门在几步外就出去","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"先看自己在什么房子里。2001 年以后按规范建的楼，要下楼梯、穿门厅才能出去的，就地躲：护住头颈钻到结实桌子下面，抓牢桌腿。"},{"anchor":"13-31","q":"生活里遇到「遇到熊、野猪、成群野」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["遇到熊、野猪、成群野狗，别跑，侧身慢慢退开","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"别跑，熊上下坡都跑得像赛马。也别爬树，黑熊棕熊都会爬。"},{"anchor":"13-32","q":"生活里遇到「雷雨」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["野外遇上雷雨，钻进有硬顶的车或建筑，避开山脊、孤树、水面和金属","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"雷暴范围内的户外没有安全的地方。钻进硬顶的车或者建筑，敞篷车、摩托、帐篷、凉亭、树下、突出的岩石下面都不算。"},{"anchor":"13-33","q":"生活里遇到「上高原按睡眠海拔（当」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["上高原按睡眠海拔（当晚睡在多高）慢慢升，症状加重就下撤，不要硬扛","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"算的是睡在多高，不是白天到过多高。睡在 2450 米以上就有高原病风险。"},{"anchor":"13-34","q":"现场情况：被蜱虫叮住。你会怎么处理？","o":["被蜱虫叮住，用尖头镊子贴着皮肤稳稳拉出来，别涂油别用火烧","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"用尖头镊子贴着皮肤夹住蜱的头部，稳稳地朝外拉出来。别涂油，别用火烧，别扭着拽，那会刺激它把带病原体的体液挤进皮肤，还容易把口器留在肉里。"},{"anchor":"13-35","q":"生活里遇到「野外的水一律烧开再喝」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["野外的水一律烧开再喝，滚开一分钟就够，不用因为海拔高多煮","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"所有能靠喝水致病的微生物，在沸点温度下几秒就死了。再滚一分钟，只是给「看走眼」留的余量，不用因为海拔高就多煮。"},{"anchor":"13-36","q":"生活里遇到「陌生人索财」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["荒郊野外被陌生人索财，钱给他，不动手，记特征，脱身后报警","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"钱给他，不动手，不还嘴。对方为几百块冒的是抢劫罪：三年以上十年以下起步，入户、持枪、致人重伤死亡的十年以上，直到死刑。"},{"anchor":"13-37","q":"生活里遇到「打架」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["撞见一群人打架，退开走人，别上去拉架、别围观、别捡地上的家伙；要报警就退到安全距离打 110","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"你一动手，劝架就成了参加打架。参加聚众斗殴判 3 年以下，人多、在马路上、拿了家伙的判 3 到 10 年。"},{"anchor":"13-40","q":"现场情况：刀、钢筋、玻璃扎进身体。你会怎么处理？","o":["刀、钢筋、玻璃扎进身体，压住异物周围止血，不要把它拔出来","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"拔出来可能造成大出血，也会让医生更难判断伤了多深。做法是：打 120，用手或者敷料压住异物周围止血，把异物垫稳别让它晃。"},{"anchor":"13-41","q":"现场情况：怀疑骨折就别再动那个部位。你会怎么处理？","o":["怀疑骨折就别再动那个部位，托着不动、冷敷 20 分钟以内，别自己掰正","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"手脚受了伤先当骨折处理，能站能动也排除不了。伤处保持不动，用手托住或用硬板在原位撑住，冷敷一次不超过 20 分钟。"},{"anchor":"13-43","q":"现场情况：不满 1 岁的婴儿噎住哭不出声。你会怎么处理？","o":["不满 1 岁的婴儿噎住哭不出声，趴着拍背 5 下、翻过来按胸口 5 下，轮着做，别按肚子","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"孩子还能咳、能哭出声，就让他自己咳，你在旁边盯着。哭不出声、脸发紫，就让人打 120，你把孩子脸朝下趴在前臂上，用掌根在两块肩胛骨中间拍 5 下。"},{"anchor":"13-44","q":"现场情况：不满 1 岁的婴儿没反应、没正常呼吸。你会怎么处理？","o":["不满 1 岁的婴儿没反应、没正常呼吸，开免提打 120，做婴儿心肺复苏：按 30 下吹 2 口气","先找偏方试试，救护电话可以晚一点打","凭感觉移动伤者，不用判断现场风险","等症状自己缓解，暂时不必求助"],"why":"拍脚底没反应、没正常呼吸，就开免提打 120，手不停。双手环抱胸口用两个拇指按，抱不住就用一只手的掌根，按下去约 4 厘米，每秒约 2 下。"}],"2":[{"anchor":"5-1","q":"手机里多个会员服务每月自动扣费，平时很少用。怎么处理？","o":["关掉所有自动续费，改为到期手动续","先忽略小额扣费","只删除 App，自动续费会自行停","继续续费，以后总会用上"],"why":"省下来的，是那些你早就不用、每月还在扣钱的订阅。翻一遍支付宝、微信、苹果和安卓的自动扣款列表，用不了 20 分钟。"},{"anchor":"5-2","q":"生活里遇到「个税汇算」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["每年三月到六月做一次个税汇算，专项附加扣除该填的填","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"这几种人办下来通常能退到钱：全年只干了几个月，年中换过工作，或者子女教育、房贷、房租、赡养老人这些扣除没填。在手机上十几分钟就能办。"},{"anchor":"5-3","q":"生活里遇到「公积金」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["公积金不只用来买房：租房、装修、物业费都能提，2026 年 9 月 20 日起按新条例办","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"公积金不是只有买房才能动。新条例把能提取的情况列了九项，租房、装修自己住的房子、交物业费都算在里面。"},{"anchor":"5-4","q":"生活里遇到「手机和宽带套餐」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["每年重算一次手机和宽带套餐，用不上的降档，运营商不给转就投诉","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"你用的老套餐，往往比现在新卖的贵几十块钱。一个月几十，一年就是几百块白扔。"},{"anchor":"5-5","q":"朋友把彩票当成长期理财。你怎么看？","o":["不买彩票","买得越久越能稳定赚钱","选号软件能改变长期回报","借钱加大投注就能回本"],"why":"按规定，乐透数字型彩票拿出来当奖金的钱，最少是销售额的 50%，双色球是 51%。也就是你每投 1 元，长期平均只能拿回 0.51 元，稳定亏掉 49%。"},{"anchor":"5-6","q":"有人推销「高收益、保本、稳赚」的理财。你会怎么做？","o":["看到「高收益」「保本」「稳赚」直接走开","先投一笔试水，承诺保本就安全","熟人推荐就不用查资质","只看收益率，不问风险"],"why":"监管部门自己的说法是：收益率超过 6% 就要打问号，超过 8% 很危险，10% 以上就要准备赔光本金。正规理财已经不许承诺保本保收益了。"},{"anchor":"5-7","q":"买手机时商家推荐信用卡最低还款和消费分期。怎样比较成本？","o":["不用信用卡最低还款，不为消费开分期或消费贷；非借不可，先把利息换成年化利率再比","只看每月手续费，忽略年化利率","每月还得少就一定划算","最低还款仍享有完整免息期"],"why":"最低还款是按天算利息的贷款，折合一年 18% 上下，用了免息期就作废。分期写「每月手续费 0.6%」，按年算约 13.8%，不是 7.2%。"},{"anchor":"5-8","q":"生活里遇到「主播打赏」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不给主播打赏、不给游戏充值、不冲动下单","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"国内玩游戏的人，平均每人一年在游戏上花约 480 元，花出去基本追不回来。法律只让未成年人没经家长同意花的钱退回来，成年人没有这一条。"},{"anchor":"5-9","q":"生活里遇到「孩子用手机充值打赏」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["孩子用手机充值打赏，八岁以上的大额支出未经家长追认可以主张退","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"八岁以上的孩子花的钱，只要金额和他的年龄、智力明显不相称，家长既不同意也不认这笔账，这笔交易就是无效的，可以要求退。不满八岁的孩子，本来就不能自己做主花钱。"},{"anchor":"5-10","q":"生活里遇到「验证码」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["教孩子记一句话：任何人让你拿家长的手机去操作、去报验证码，都是骗子","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"这六类骗局的套路各不相同，但最后一步永远是同一个动作：让孩子拿家长的手机去转账，或者念验证码。所以教会一句就够用了：谁让你动家长的手机、报验证码，谁就是骗子。"},{"anchor":"5-11","q":"生活里遇到「延长保修」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["拒绝电子产品的延长保修（延保）","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"延保一般卖到原价的 10% 到 50%，卖延保的赚头是普通商品的十几倍，这个差价就是你多付的钱。洗衣机、冰箱的电机这类主要部件，国家本来就规定保修 3 年。"},{"anchor":"5-12","q":"生活里遇到「仿制药」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["优先选通过一致性评价的仿制药和集采中选药","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"集采第二批药平均降价 53%，降得最多的降了 93%。到 2026 年 4 月，已经做了 11 批，覆盖 490 种药。"},{"anchor":"5-13","q":"生活里遇到「医保」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["在医保 App 上办一次家庭共济绑定，职工医保个人账户的钱就能给配偶、父母、子女看病买药","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"办一次绑定，你职工医保个人账户里的钱，就能给配偶、父母、孩子看病买药用。不办，这笔钱就只能你自己用，一直躺在账户里。"},{"anchor":"5-14","q":"生活里遇到「自来水」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["喝烧开的自来水，不常年订饮水机用的桶装水、买瓶装水","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"北京自来水折合 0.005 元一升。饮水机用的桶装水按 20 元一桶算，约 1 元一升，贵 200 多倍。"},{"anchor":"5-15","q":"生活里遇到「股票」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不频繁交易股票，行情暴涨暴跌的时候更要少动手","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"买卖最频繁的美国家庭，每年只赚 11.4%，同期整个市场是 17.9%，差距几乎全是手续费。国内 2014 到 2015 年那轮暴涨暴跌里，账户最小的 85% 家庭买卖太勤。"},{"anchor":"5-16","q":"生活里遇到「杠杆」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不借钱投资、不加杠杆、不买自己看不懂的","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"借钱买股票，一旦跌破线，你又补不上钱，就会被强制卖掉。账面上的亏损当场变成真亏，连「等它涨回来」的机会都没有。"},{"anchor":"5-17","q":"生活里遇到「指数基金」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["用宽基指数基金替代主动管理基金作为长期底仓（长期拿着不动的那部分钱）","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"主动基金合起来买的那堆股票，已经很接近整个市场了。但它们多收的那笔管理费，是实打实从你到手的收益里扣掉的。"},{"anchor":"5-18","q":"生活里遇到「同类基金优先选费率低」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["同类基金优先选费率低的","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"一年的费率每高 1 个百分点，20 年后到手的钱少约 18%，30 年后少约 26%。在同一类基金里挑费率低的，是这件事上唯一一个你能提前确定的东西。"},{"anchor":"5-19","q":"准备存放一笔积蓄，朋友让你全押一只股票。你会怎样分配？","o":["别把钱押在一只股票、一个平台、一套房上","集中一只最熟的股票就没有风险","一个平台能提供产品就可以全放进去","房子、股票和平台没必要分散"],"why":"几样东西只要不是完全一起涨、一起跌，把钱分开放，平均能赚到的不变，账户的起伏却会小一些。反过来，钱全押在一只股票、一个平台、一套房上，它一出事，就等于你全部出事。"},{"anchor":"5-21","q":"生活里遇到「健身房」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["健身房按次付费或短周期付费，除非有一年以上的稳定记录","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"美国那份三年的数据里，选月费 70 美元以上合同的会员，平均每月只去 4.3 次，折合每次超过 17 美元。而按次买 10 次卡，每次只要 10 美元。"},{"anchor":"5-22","q":"生活里遇到「预付款」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["交预付款要签书面合同；商家出风险要停收，跑路前你有权要回未消费的余额","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"商家收你的预付款，必须和你签书面合同，写清楚怎么退。商家经营出了大问题，就该停止收钱，要停业或搬走也得提前告诉你。"},{"anchor":"5-23","q":"你想买一件昂贵但非必需的东西，正赶上大促倒计时。怎样决定？","o":["大额非必需购买设 24 小时冷静期，网购善用七日无理由退货","立刻下单，倒计时不会误导","先付定金，之后再看是否需要","只看划线价，不看实际使用"],"why":"省下来的，是那些你第二天就不想要的东西。网购的东西，从你收到货那天算起，七天之内可以无理由退。"},{"anchor":"5-24","q":"生活里遇到「大促」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不为「划线价」和大促囤货","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"人判断一样东西贵不贵，靠的是最先看到的那个数字，之后再怎么调整都调不够。所以「原价 999 现价 499」会让你系统性地高估它有多便宜。"},{"anchor":"5-25","q":"生活里遇到「保险」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["保险优先买消费型，把「返还」「分红」当作不保证的部分","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"分红和返还的那部分钱，保险公司不保证给你。说明书上必须用加粗字写明「未来的保单红利为非保证利益」。"},{"anchor":"5-26","q":"生活里遇到「三者险」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["三者险买够：交强险限额全国统一且不高，超出的部分从你自己家里出","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"你有责任时，交强险最多赔三项：死亡伤残 18 万元，医疗费用 1.8 万元，财产损失 2000 元。三项分开算，不能互相挪用。"},{"anchor":"5-27","q":"刚存下一笔钱，还没有备用生活费。第一步怎么安排？","o":["先存出 3 到 6 个月生活费的应急金，放在随时能取的地方","全部买不能随时取出的产品","先借钱投资，备用金以后再存","把应急钱放在高风险资产里"],"why":"把 3 到 6 个月的生活费放在随时能取出来的地方。这样失业或者生病的时候，你就不用去借那种一年要付 18% 利息的钱，也不用亏着把手里的投资卖掉。"},{"anchor":"5-28","q":"生活里遇到「房贷」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["提前还房贷之前先做一道比较题，不要凭感觉","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"提前还房贷，等于稳稳赚到你的房贷利率。所以只问一件事：你能长期稳定拿到的税后收益，比房贷利率高吗？高就别急着还，不高或说不准就还。"},{"anchor":"5-29","q":"生活里遇到「网购」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["网购认平台规则和法条，不认主播和「好评」","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"商家骗你，按你付的价款三倍赔，不到 500 元的按 500 元算。平台明知卖家侵权还不管，要跟着一起赔。"},{"anchor":"5-30","q":"生活里遇到「直播间」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["直播间买的东西出了问题，先向平台要卖家和带货人的信息，平台必须给","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"直播间买东西出了问题，最常见的死结是你找不到该告谁。这时候你可以直接要求平台，提供直播间运营者和带货人的信息，以及相关的经营记录。"},{"anchor":"5-31","q":"生活里遇到「食品」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["买到不安全的食品，除了退钱还能要十倍价款，增加赔偿不足一千元的按一千元算","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"买到过期、变质的食品，东西本身、包装和小票就是你的证据，别急着扔。你可以要价款十倍或损失三倍的赔偿，不到一千元的按一千元算。"},{"anchor":"5-32","q":"生活里遇到「3C 认证」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["买大件前先查国家抽检通报、3C 认证和能效标识","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"2024 年国家抽检了 25250 批次产品，14.3% 不合格。电商渠道更差：抽了 7297 批次，23.5% 不合格；实体店是 15.1%。"},{"anchor":"5-33","q":"生活里遇到「手串、玉石、名表、潮」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["手串、玉石、名表、潮玩按「花掉的钱」算账，不按「存下的钱」算","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"这类东西的价钱里先含了一截消费税：每只 1 万元及以上的手表是 20%，金银铂金首饰和钻石是 5%，其他珠宝玉石是 10%，增值税另算。这笔税转手卖掉时拿不回来。"},{"anchor":"5-34","q":"生活里遇到「珠宝玉石」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["珠宝玉石只认带 CMA 标志的检测报告，并到发证部门官网核一下这家机构","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"证书能伪造，所以要查的是出证书的那家机构。检测机构对外出报告必须有资质，报告上要印 CMA 标志。"},{"anchor":"5-35","q":"生活里遇到「盲盒」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["盲盒、抽卡这类随机销售，按「这笔钱不会回来」算","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"商家必须把抽取规则、抽取概率、限量款数量摆在显眼处，不许后台操纵结果，不许设空盒。保底和花钱、抽取次数的上限，文件只是鼓励商家做。"},{"anchor":"5-36","q":"生活里遇到「食品」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["在意食品里加了什么，就买预包装的：散装柜台法律上不要求标配料表","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"法律只要求预包装食品标配料表，散装的不要求。散装柜台只要标名称、生产日期、保质期和谁生产的。"},{"anchor":"5-37","q":"生活里遇到「股票」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["亏了的股票也要按事先定好的规则卖掉，不靠往下补仓摊平成本翻身","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"人的本能是赚了就卖、亏了死扛。一万个美国账户七年的记录里，涨了的股票被卖掉的可能比跌了的高五成以上。"},{"anchor":"5-38","q":"生活里遇到「美股」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["想买美股这类海外资产，走 QDII 基金或港股通，别去境外券商开户，也别拿每年的换汇额度去买","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"老虎、富途、长桥这类境外券商，2026 年 5 月起不许再给境内的人开户。已经开了的，两年内只能卖出、把钱转出来，不能再买。"},{"anchor":"5-39","q":"生活里遇到「保险」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["只给自己扛不住的损失买保险，扛得住的损失用应急金兜着","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"你交的保费不会全部赔回来，有一部分要付保险公司的费用和利润。所以值得买的，是很少发生、一旦发生家里掏不出来的损失，比如大病、开车撞伤人、家里挣钱的人走了。"},{"anchor":"5-40","q":"生活里遇到「定期寿险」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["家里有人靠你的收入过日子，先给挣钱的人买定期寿险，别先给孩子买","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"定期寿险只保固定的年数，这些年里人走了，家里拿到一笔钱。它是给靠你收入过日子的家人留的，比如房贷没还完、孩子还小。"},{"anchor":"5-41","q":"生活里遇到「签了一年以上的人身险」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["签了一年以上的人身险又后悔，在犹豫期内退掉，保费基本全退","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"一年以上的人身险都有犹豫期。在银行买的，是收到保单后 15 天，这期间退保最多扣 10 元工本费。"},{"anchor":"5-42","q":"生活里遇到「保险」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["在银行柜台签字前，先看清手里的是存款还是保险","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"银行能代卖保险，但不许说成存款。保险合同的封面要用大字印「保险合同」和保险公司的名字，不许出现「存款」「储蓄」字样。"},{"anchor":"5-43","q":"生活里遇到「保险」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["想退保就自己找保险公司办，别找「代理退保」，觉得被误导了打 12378 投诉","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"网上喊「全额退保、不成功不收费」的，多半是非法代理退保。他们要拿走退回来的钱的三到五成，还要你的身份证、银行卡和验证码。"},{"anchor":"5-44","q":"生活里遇到「保险」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["保单上把受益人写成具体的人，出了事记得去领钱：寿险 5 年、其他保险 2 年内要主张","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"没写受益人，或者受益人先走了，保险金就算遗产，要先拿去还去世的人欠的债。受益人写了「妻子某某」，后来离婚了，出事时算没写。"},{"anchor":"5-45","q":"生活里遇到「虚拟货币」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["别拿钱买比特币、泰达币这类虚拟货币，别人拉你一起投也不跟：交易不受法律保护，亏了打官司也要不回来","只看每月付款额，不算总成本和风险","先付款再看合同与规则","相信「稳赚」承诺，不查来源"],"why":"国内不承认虚拟货币是钱，个人买币的交易可以被判无效，亏了算自己的。有人跟人买泰达币，付了约 44.8 万元，后来平台提不了现，起诉要钱被法院驳回。"},{"anchor":"6-1","q":"你不缺营养，却看到广告说复合维生素能延寿。该怎么判断？","o":["不要为了长寿或防心血管病吃复合维生素","每天吃一片肯定能防心血管病","品牌越贵，预防效果越好","多种补剂一起吃就能延寿"],"why":"1.4 万名男医生吃了十一年复合维生素。心脏和血管出大事的人、死掉的人，和不吃的一样多。"},{"anchor":"6-2","q":"生活里遇到「鱼油」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要为了预防心血管病吃普通鱼油","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"两项大试验分别找了 2.6 万人和 1.5 万名糖尿病患者。每天吃 1 克鱼油的人，心脏血管出大事的、死掉的，都和不吃的一样多。"},{"anchor":"6-3","q":"生活里遇到「维生素 D」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要为了长寿给不缺维生素 D 的人补维生素 D","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"本来就不缺维 D 的人补上 5 年，得癌症、得心血管病和死亡的人数，都和不补的人一样。查出来确实缺的人、有骨质疏松的人、长期晒不到太阳的人不在这条里面，他们按医生说的补。"},{"anchor":"6-4","q":"生活里遇到「抗氧化补剂」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要为了防癌吃抗氧化补剂（β 胡萝卜素、维生素 E、维生素 A）","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"这一条不只是没用。78 项试验、近 30 万人合起来算，吃抗氧化补剂的人死亡率反而略高一点。"},{"anchor":"6-5","q":"生活里遇到「氨糖」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要指望氨糖（葡萄糖胺）/软骨素治膝关节炎","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"膝盖有骨关节炎的人吃 24 周假药，也有六成说没那么疼了。吃氨糖或软骨素的人只比这多出四五个百分点，小到可能只是碰巧。"},{"anchor":"6-6","q":"生活里遇到「维生素 C」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要靠维生素 C 预防感冒","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"天天吃维 C 基本不会让你少得感冒，感冒了才开始吃，效果也时有时无。天天吃能把一次感冒缩短约 8%，也就是少难受半天，值不值一年三五百自己算。"},{"anchor":"6-7","q":"体检没有症状，销售推荐昂贵的全身扫描套餐。你会怎么选？","o":["不要给没有症状的自己做「全身 PET-CT」或「肿瘤标志物套餐」","做得越多越能保证不得癌","肿瘤标志物套餐能替代有证据的筛查","没有症状也要每年全身 PET-CT"],"why":"没症状的人去查，查出来最多的是虚惊一场。做全身 CT 的人八成多至少查出一处「异常」，将近四成被叫回去复查，可大多数是良性的。"},{"anchor":"6-8","q":"生活里遇到「不要指望手环/手表的」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要指望手环/手表的运动量化帮你减重","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"超重的人做同样的饮食和运动安排，戴运动手环的人两年减了 3.5 公斤，不戴的人反而减了 5.9 公斤。想减重，花钱买设备帮不上忙，真正管用的是运动本身。"},{"anchor":"6-9","q":"生活里遇到「有机食品」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要为了「更健康」花溢价买有机食品","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"没有有力的证据说有机食品更有营养。真正看了人吃完以后健康怎么样的研究只有 3 项，都没看出差别。"},{"anchor":"6-10","q":"生活里遇到「保健品」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要花大钱买保健品、膏方、滋补品来「调理身体」","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"多维、鱼油、维 D 这些常见成分，本节前六条已经一样样查过，都没看出管用。包装上那句「保健食品不是药物，不能代替药物治疗疾病」，是管保健食品的部门规定必须印的。"},{"anchor":"6-11","q":"生活里遇到「益生菌」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要在没有肠道问题时长期吃益生菌","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"45 项在健康成年人身上做的试验合起来看，吃益生菌不能让肠道里的菌长期变个样，停了就回到原样，血脂也没有改善。吃抗生素吃出腹泻这类特定情况另有证据，不在这条里面。"},{"anchor":"6-12","q":"生活里遇到「冷水澡」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要为了「增强免疫力」逼自己洗冷水澡","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"3018 人的试验里，洗冷水澡的人请病假的次数少了 29%，但请假的总天数和别人一样，所以谈不上少生病。2025 年把 11 项试验合起来看，冲完冷水之后，身体发炎的指标反而短暂升高，免疫的指标没变化。"},{"anchor":"6-13","q":"有人推销「排毒清肠」酵素和碱性水。你会买吗？","o":["不要买排毒、清肠、酵素、碱性水这类产品","身体需要定期靠酵素排毒","碱性水能清除体内毒素","价格贵说明功效经过验证"],"why":"排毒这个产业做得很大，可支持它的临床证据非常少，也没人拿市面上卖的排毒饮食认真做过试验。有人去查饮食酸碱、碱性水和癌症有没有关系，够格的研究只找到 1 篇，也没看出关联。"},{"anchor":"6-14","q":"生活里遇到「喝水」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要为了凑够「每天 8 杯水」强迫自己喝水","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"有人专门去追「每天 8 杯水」的出处，一项支持它的研究都没找到。食物和别的饮料里本来就带着大量水分，所以用不着喝那么多。"},{"anchor":"6-15","q":"生活里遇到「塔罗」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要花钱算命、看塔罗、看星座来做决定","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"有个经典的课堂实验：学生拿到的「个人性格分析」其实人手一份、一模一样，大家却普遍觉得很准。算命显得准，道理就在这里。"},{"anchor":"6-16","q":"生活里遇到「防蓝光眼镜」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要买防蓝光眼镜来「保护视力」，也不要相信「对着屏幕干几个月眼睛就废了」，但眼睛胀痛发红要当急症","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"防蓝光镜片没用，不买能省下几百到上千的加价。和普通镜片比，戴它的人眼睛累不累、能看多清都没差别，也没找到它护眼底的证据。"},{"anchor":"6-17","q":"生活里遇到「排毒」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要把献血当保健：「排毒、降血脂、防心梗」没有随机试验支持，频繁献倒是真会缺铁","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"说献血能排毒、降血脂、防心梗，靠不住。能一直去献血的人，本来身体就更好，把这层扣掉，每年多献一次血的死亡率降幅从近两成缩到 7.5%。"},{"anchor":"6-18","q":"生活里遇到「体检套餐」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要靠通用体检套餐防病，按年龄性别做那几项有证据的筛查","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"定期做通用健康检查的人，和不做的人死亡率一样，死于心血管病、癌症的也一样多。按年龄性别做那几项有证据的筛查就够了。"},{"anchor":"6-19","q":"生活里遇到「尿酸」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要因为体检查出尿酸高、但从没痛过，就开始吃降尿酸药","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"尿酸超标、但从没发作过痛风也没长痛风石的人，美国风湿病学会建议先不吃降尿酸药。24 个人吃满 3 年，才拦得住一次痛风发作。"},{"anchor":"6-20","q":"生活里遇到「胆囊结石」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要因为体检查出胆囊结石、但从没疼过，就去预防性切胆囊","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"胆囊里有石头、但从没疼过的人，近九年里约八成一直没出症状。不动它，每年出胆囊炎、胰腺炎这类急症的约千分之一到千分之三。"},{"anchor":"6-21","q":"生活里遇到「肾结石」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要为了防肾结石把钙戒掉","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"长过草酸钙结石的人常被劝少吃钙，试验的结果正好反过来。反复长结石的男性正常吃钙、同时少吃动物蛋白和盐，五年里复发的人只有吃低钙饮食的一半。"},{"anchor":"6-22","q":"生活里遇到「水晶」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要为了「转运」「招财」「养人」买水晶、手串、貔貅这类物件","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"说戴了能改运、能招财、能养人，没有可以核查的证据。它和算命显得准是一个道理，话说得足够笼统，你会自己往身上套。"},{"anchor":"6-23","q":"生活里遇到「不要指望买东西改善心」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要指望买东西改善心情或身份感","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"把钱和物质看得越重的人，自己觉得越不幸福，但关联很弱，也分不出谁导致谁。还有研究发现，花钱买一段经历比买东西更让人快乐。"},{"anchor":"6-24","q":"生活里遇到「换房」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要为了「在周围人里往上挪一档」多花钱换房、换车、换圈子","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"拿收入一样的人来比，邻居挣得越多，这个人报告的幸福感越低。这只发生在学历和自己相同、又常来往的邻居之间。"},{"anchor":"6-25","q":"生活里遇到「意志力」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要相信「意志力像肌肉，用一会儿就没了」","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"流行的说法是：先做一件费自控的事，接下来就更容易破功，所以要省着用意志力。23 个实验室、2141 人按同一套方案重做了这个实验，结果几乎是零。"},{"anchor":"6-26","q":"生活里遇到「吃早餐」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要指望吃早餐或 16:8 轻断食帮你控制体重，吃饭时间挑你能长期坚持的","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"流行说法是不吃早餐会让人午饭晚饭暴食，一天总量反而更多。试验里不是这样：不吃早餐的人一天少吃了两百多千卡，体重还略轻一点。"},{"anchor":"6-29","q":"生活里遇到「搬运」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要指望学会「正确搬运姿势」、上搬运培训就能防腰痛，要减的是搬的重量和次数，平时多锻炼","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"上过搬运姿势培训的工人，后来腰痛的并不比没上过的少。搬东西时腰弯得多的人，也没看出更容易腰痛。"},{"anchor":"6-30","q":"生活里遇到「骨折」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不要指望骨折之后猛补钙、喝骨头汤能让骨头长得更快","宣传说天然就长期购买","多买几种叠加使用，效果一定更好","先买高价套餐，没必要核对证据"],"why":"骨折后补维生素 D 的试验，没有一项看出骨头长得更好。钙和维 D 一起补的研究很少，说不清有没有用。"},{"anchor":"8-1","q":"生活里遇到「交通事故」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["出了交通事故先停车、救人、报警，不要跑","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"跑了，这起事故就默认算你全责。驾照吊销，这辈子都不能再考。"},{"anchor":"8-2","q":"发现自己刚给骗子转了钱，最该先做哪件事？","o":["发现被骗，立刻打 110 或 96110 要求止付，别先自己查","先独自调查骗子身份","等对方退款承诺到期再报警","删掉聊天记录，避免继续被骗"],"why":"钱刚转出去的那一小段时间，是唯一的窗口。这段时间警方可以紧急止付、快速冻结，银行必须配合。"},{"anchor":"8-3","q":"生活里遇到「反诈」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["记住反诈硬规则：来电不轻信、信息不透露、链接不点击、转账多核实，七种最常见的骗局都是这个形状","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"凡是让你转账、共享屏幕、下载陌生 App、点链接、报验证码的，先挂断，再用官方号码打回去核实。刷单返利、虚假投资理财、网络贷款、冒充客服、冒充公检法、杀猪盘、色诱刷单这七类最常见，都是要你先转钱。"},{"anchor":"8-4","q":"视频电话里像是熟人在借钱，你听到的声音也很像。怎么核实？","o":["视频里看见脸、电话里听见声音都不算核实，涉及转账先挂断，用自己通讯录里的旧号码打回去","既然看见脸就立刻转账","让对方再发一段语音即可","只通过来电号码回拨"],"why":"看见脸、听见声音，都不算核实。只要涉及转账就先挂断，再用自己通讯录里存的旧号码打回去，或者找共同认识的人问一句。"},{"anchor":"8-9","q":"生活里遇到「征信报告」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["每年免费查两次自己的征信报告，看有没有不是自己办的贷款和卡","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"你每年可以在网上免费查两次自己的信用报告，十分钟就能查完。用人民银行征信中心官网或者手机银行查，别用第三方的「查征信」App，那类 App 在收集你的信息。"},{"anchor":"8-17","q":"生活里遇到「签字」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["签字前把纸看完，不替人签字，不在空白纸上签","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"签了就算数，按手印和签名一样算数。「没看清」「以为是别的」在法庭上基本站不住。"},{"anchor":"8-18","q":"生活里遇到「担保」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["借钱写清借条，替人担保前先想清楚自己愿不愿意替他还","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"借条要写全：出借人、借款人、金额、利率、期限、还款方式，双方签名。钱走转账，不给现金，写全了才好起诉。"},{"anchor":"8-19","q":"生活里遇到「诉讼时效」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["维权有期限：民事诉讼时效 3 年，劳动仲裁 1 年，过了对方一句「超过时效」就够","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"民事诉讼时效 3 年，从你知道权利受损那天算起。过了期，法院不会主动管，可对方在法庭上说一句「超过时效」就够了，钱还在，只是要不回来。"},{"anchor":"8-22","q":"生活里遇到「被骗」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["网购、二手交易被骗，先平台投诉，再报警，再算值不值得起诉","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"先找平台。平台有保证金和处罚规则，处理最快。"},{"anchor":"8-27","q":"生活里遇到「上门维修」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["上门维修、验车、装修，先问价再动手，全程在旁边看着","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"家电维修必须明示收费标准，给维修凭证和发票，不得虚报故障，不得故意换掉性能正常的零件，情节严重的罚 3 万元以下。所有经营者都必须明码标价，不得在标价之外加价。"},{"anchor":"8-44","q":"生活里遇到「赌债」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["家里人赌博欠了债，别急着替他还：赌债法律不保护，为赌借的钱也不算夫妻共同债务","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"在赌桌上欠的钱，法院不保护。债主明知他借钱去赌还借给他，这笔钱法院也不保护。"},{"anchor":"8-45","q":"熟人请你刷脸「做个见证」，说贷款与自己无关。你怎么办？","o":["熟人让你「帮忙刷个脸、做个见证」去办贷款，或者要你念验证码，别答应：这叫 AB 贷，借款人是你，不是担保人","熟人担保就放心刷脸","先刷脸，合同之后再看","只要没拿到钱就不是借款人"],"why":"所谓「帮忙刷个脸、做个见证」，其实是用你的名字向银行借钱。借款人是你，不是担保人，钱转给熟人以后，银行照样找你还。"},{"anchor":"8-46","q":"生活里遇到「报警」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["给门窗装好锁、门外装一盏感应灯，出门真的锁上：防入室盗窃靠这几样，单装一个报警器看不出用","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"英国的数据显示，门锁加窗锁的人家，被人进屋偷东西的几率只有什么都没装的十二分之一。再加一盏门外感应灯，降到三十多分之一。"}],"3":[{"anchor":"8-1","q":"生活里遇到「交通事故」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["出了交通事故先停车、救人、报警，不要跑","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"跑了，这起事故就默认算你全责。驾照吊销，这辈子都不能再考。"},{"anchor":"8-5","q":"生活里遇到「被指控」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["被指控或被传唤，先请律师，不私了、不删记录","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"被叫去问话的第一次，你就可以请律师了。律师要求见你，看守所最迟 48 小时内安排，谈话不会被听。"},{"anchor":"8-6","q":"生活里遇到「自首」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["出了事主动去说清楚：自首最多能减四成刑，犯罪较轻的还能减更多甚至免罚，「躲过追诉期」这条路是堵死的","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"自首最多能把刑期减掉四成，情节较轻的可以直接不罚。被找上门之后才如实交代，最多也能减两成。"},{"anchor":"8-7","q":"生活里遇到「喝了酒就不碰方向盘」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["喝了酒就不碰方向盘，包括电动车和「挪一下车」","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"酒后开车，扣证 6 个月，罚一两千。再犯就拘留加吊销。"},{"anchor":"8-8","q":"生活里遇到「银行卡」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不把银行卡、手机卡、支付账号借给任何人，「跑分」不是兼职","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"把银行卡、手机卡、支付账号租给、借给、卖给别人，这件事本身就违法。罚违法所得的 1 到 10 倍，没有所得的最高罚 20 万元，情节严重的拘留 15 日，还会被记入信用记录、限制账户功能。"},{"anchor":"8-9","q":"生活里遇到「征信报告」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["每年免费查两次自己的征信报告，看有没有不是自己办的贷款和卡","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"你每年可以在网上免费查两次自己的信用报告，十分钟就能查完。用人民银行征信中心官网或者手机银行查，别用第三方的「查征信」App，那类 App 在收集你的信息。"},{"anchor":"8-10","q":"生活里遇到「冲突」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["起了冲突先报警不动手，先动手的那个几乎一定吃亏","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"打人，拘留 5 到 10 日，罚五百到一千。结伙打、打老人孕妇孩子残疾人、多次打人，拘留 10 到 15 日，罚一两千。"},{"anchor":"8-11","q":"生活里遇到「侵害」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["躲不掉的侵害可以还手，但只打正在动手的那个人，他停你就停","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"对方正在侵害你或者别人的时候，你动手制止、把他打伤，不负刑事责任。对方正在行凶、杀人、抢劫、强奸、绑架，打伤打死也不算过当。"},{"anchor":"8-12","q":"生活里遇到「欠薪」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["跟谁结了怨——被欠薪、被开除、被坑了钱——走投诉、仲裁、起诉，别去找人算账","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"走法定路径，最坏的结果是钱要不回来。去报复，结果是钱照样要不回来，还要自己抵命。"},{"anchor":"8-16","q":"生活里遇到「网暴」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["网上不骂人、不造谣、不转发没核实的事；被网暴先留证再报警","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"公开骂人或者造谣诽谤，拘留 5 日以下，或者罚 1000 元以下，情节较重的拘留 5 到 10 日。情节严重就构成侮辱罪、诽谤罪，判 3 年以下。"},{"anchor":"8-17","q":"生活里遇到「签字」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["签字前把纸看完，不替人签字，不在空白纸上签","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"签了就算数，按手印和签名一样算数。「没看清」「以为是别的」在法庭上基本站不住。"},{"anchor":"8-18","q":"生活里遇到「担保」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["借钱写清借条，替人担保前先想清楚自己愿不愿意替他还","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"借条要写全：出借人、借款人、金额、利率、期限、还款方式，双方签名。钱走转账，不给现金，写全了才好起诉。"},{"anchor":"8-19","q":"生活里遇到「诉讼时效」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["维权有期限：民事诉讼时效 3 年，劳动仲裁 1 年，过了对方一句「超过时效」就够","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"民事诉讼时效 3 年，从你知道权利受损那天算起。过了期，法院不会主动管，可对方在法庭上说一句「超过时效」就够了，钱还在，只是要不回来。"},{"anchor":"8-20","q":"生活里遇到「被执行」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["被起诉、被执行了，如实报财产、能还多少还多少，别把房和钱转给亲友或公司","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"把房子挂到公司名下、把钱转给亲友，正是拒执罪写明的情形，判 3 年以下，情节特别严重的判 3 到 7 年。帮着藏钱过户的亲友和公司按同伙算，钱照样追回。"},{"anchor":"8-28","q":"生活里遇到「挂名法人」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["别当「挂名法人」，别把身份证借给人注册公司","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"法律预设法定代表人就是那个管事的人，「我只是挂个名、什么都不知道」不是免责的理由。法定代表人执行职务给别人造成损害，公司先赔，赔完可以回头找有过错的你追偿。"},{"anchor":"8-29","q":"生活里遇到「出入境不帮陌生人带东」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["出入境不帮陌生人带东西，不代收来路不明的包裹","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"外交部领事司给出国公民的建议是：不要替别人携带行李物品，特别是违禁品，或者你并不了解的东西。行李里真查出毒品或者走私品，「我不知道里面装的什么」要你自己举证。"},{"anchor":"8-30","q":"生活里遇到「养狗」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["养狗必须牵绳：不牵绳出了事是无过错责任（你有没有错都要赔），赔到底。狗还要按时打狂犬病疫苗、办养犬登记","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"狗伤了人，不管你有没有错原则上都要赔，只有证明对方故意或有重大过失才能少赔。没牵绳的只剩「对方故意」这一条能减轻，情节较重的还可能被拘留。"},{"anchor":"8-33","q":"生活里遇到「被人捏造事实举报」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["被人捏造事实举报，可以要求追究：够治安处罚的拘留 5 日起，够罪的判 3 年以下","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"捏造事实诬告陷害别人，想让他被追究刑责或者被治安处罚，本身就是违法。这种要拘留 5 日以下，或者罚 1000 元以下。"},{"anchor":"8-34","q":"生活里遇到「证据不足本来就应当判」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["证据不足本来就应当判无罪，逼出来的口供应当排除；判了还有申诉和再审","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"定罪的门槛写在刑事诉讼法里：定案的证据要经过法定程序查证属实，还要综合全案证据排除合理怀疑。做不到，就应当判无罪。"},{"anchor":"8-35","q":"生活里遇到「国家赔偿」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["被羁押后撤案、不起诉或者判无罪的，去申请国家赔偿，按天算钱","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"被拘留、逮捕后又撤案、不起诉或判无罪的，能申请国家赔偿。被关的日子按天赔，2026 年 5 月 18 日起每天 495.94 元，一年约 18 万元。"},{"anchor":"8-37","q":"生活里遇到「网暴」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["被网暴了：先开防护、先固证，再在平台、禁令、报警三条路里挑","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"当场先做三件事：打开平台的防护设置，用快捷取证把内容存下来，再从快捷入口举报。之后可以向法院申请禁令，让他先停手。"},{"anchor":"8-39","q":"生活里遇到「报警」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["报警当场要受案回执，不立案要书面通知：7 日内可申请复议，再 7 日可申请复核，检察院能通知公安立案","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"报了警要当场拿到受案回执，这是你报过案的唯一凭据。公安决定不立案，应当给你书面的不予立案通知书。"},{"anchor":"8-40","q":"生活里遇到「别给办案、执法的人送」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["别给办案、执法的人送钱送卡：行贿自己也判，对监察、执法、司法人员行贿还要从重","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"「花点钱把事摆平」在刑法里是独立的罪，被抓的不只是收钱那个人。行贿判 3 年以下。"},{"anchor":"8-41","q":"生活里遇到「录音」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["可能翻脸的电话和面谈，直接开录音：自己参加的谈话，不用先征得对方同意","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"借钱、欠款、赔偿、退款、劳动纠纷，电话里说清楚了却没留下东西，几个月后双方就可能各说一套。你自己参加的谈话可以录下来，没提前告诉对方，不会单凭这一点就不能当证据。"},{"anchor":"8-42","q":"生活里遇到「现场出了事」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["现场出了事，先拍全景，再拍位置关系，最后拍损坏和伤情，原图原视频别删","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"只对着车上一道划痕或者地上一件东西拍特写，过几天没人知道它原来在哪。先拍一段全景，把路口、门牌、车、人和周围都收进去，再拍相互位置，最后拍细节。"},{"anchor":"8-43","q":"生活里遇到「报警」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["被家暴了：先报警留下出警记录，再去法院申请人身安全保护令，不用先离婚，也不收费","先删掉聊天和转账记录，再自己找人解决","把验证码或支付账号交给对方核实","只凭对方口头保证，不留书面凭证"],"why":"在全世界被杀害的女性里，三分之一以上是伴侣下的手，往往是长期家暴的结局。同样挨打的女性里，被掐过脖子的，后来被杀的几率是没被掐过的 7 倍多。"},{"anchor":"8-45","q":"熟人请你刷脸「做个见证」，说贷款与自己无关。你怎么办？","o":["熟人让你「帮忙刷个脸、做个见证」去办贷款，或者要你念验证码，别答应：这叫 AB 贷，借款人是你，不是担保人","熟人担保就放心刷脸","先刷脸，合同之后再看","只要没拿到钱就不是借款人"],"why":"所谓「帮忙刷个脸、做个见证」，其实是用你的名字向银行借钱。借款人是你，不是担保人，钱转给熟人以后，银行照样找你还。"},{"anchor":"9-1","q":"群里出现未经核实的灾情图片，朋友催你转发。你怎么做？","o":["群里不转发不知真假的灾情、疫情、警情消息，不 P 图、不用 AI 造现场图","标上「据说」就可以转","把图改一下再发就不算传播","不是自己编的就没有责任"],"why":"一条灾情、疫情、警情的消息，你明知是假的还转出去，罚得和自己编一样重。不是你编的也一样：拘留 5 到 10 日，还要罚 1000 元。"},{"anchor":"9-2","q":"生活里遇到「英烈」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不发、不转侮辱英烈的图片、表情包和评论，不拿国旗国歌开玩笑","觉得是小事就可以绕过规则","只要别人也这么做，自己就没有责任","事后删掉记录就不会有法律风险"],"why":"拿英烈、国旗、国歌开玩笑，轻的拘留 5 到 10 日，或者罚 1000 到 3000 元。重一些的拘留 10 到 15 日。"},{"anchor":"9-5","q":"招聘写着日结，要求用你自己的银行卡帮忙收款取现。你会怎么选？","o":["「兼职」要你用自己的卡收钱、取现、转账，不管给多少好处费都不做","报酬高就值得试一天","只帮忙转一次就不会担责","签一张口头保证就可以做"],"why":"这类兼职挣的是几百块，代价是留一份案底。有人带着身份证和 1 张银行卡去指定地点，配合转账取款，挣了 500 多元。"},{"anchor":"9-6","q":"生活里遇到「贷款」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["有人拉你去「包装材料」贷款、按贷款额分你好处费，一个都不做","觉得是小事就可以绕过规则","只要别人也这么做，自己就没有责任","事后删掉记录就不会有法律风险"],"why":"帮人「包装材料」去贷款、拿分成，按诈骗办。有个 126 人的团伙，把没工作的人包装成「优质客户」，在 80 多家银行骗贷 3000 多万元。"},{"anchor":"9-7","q":"生活里遇到「银行卡」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["捡到银行卡不取钱，捡到手机、钱包联系失主或交给警察，不揣走","觉得是小事就可以绕过规则","只要别人也这么做，自己就没有责任","事后删掉记录就不会有法律风险"],"why":"捡到东西留着自己用，金额到了「数额较大」又不肯交出来，判 2 年以下，数额巨大的判 2 到 5 年。拿捡来的银行卡去 ATM 取钱更重，算冒用别人的信用卡，数额较大就判 5 年以下，还要罚 2 万到 20 万元。"},{"anchor":"9-8","q":"生活里遇到「优惠用自己的真实身份」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["优惠用自己的真实身份领，不买虚拟号批量注册小号，不靠漏洞重复领","觉得是小事就可以绕过规则","只要别人也这么做，自己就没有责任","事后删掉记录就不会有法律风险"],"why":"用自己的真实身份、一个号领一次券，不在处罚范围里。批量注册假用户、自己下单自己接单去多领，按诈骗办，骗到 3000 元就能判 3 年以下，3 万元起判 3 到 10 年。"},{"anchor":"9-9","q":"生活里遇到「阳台、窗户不往外扔任」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["阳台、窗户不往外扔任何东西，烟头、垃圾袋、酒瓶都算","觉得是小事就可以绕过规则","只要别人也这么做，自己就没有责任","事后删掉记录就不会有法律风险"],"why":"往楼下扔东西，没砸到人也能拘留 5 日、罚 1000 元，情节严重的拘留 10 到 15 日。砸到人就换罪名了：有人在 21 楼酒后把空酒瓶、玻璃杯扔到楼下操场，砸中 13 岁学生致重伤，判 10 年。"},{"anchor":"9-10","q":"生活里遇到「仿真枪」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不网购仿真枪、钢珠枪、气枪，不买来路不明的「玩具枪」","觉得是小事就可以绕过规则","只要别人也这么做，自己就没有责任","事后删掉记录就不会有法律风险"],"why":"网上买的钢珠枪、气枪，枪口比动能到了 1.8 焦耳/平方厘米，就按枪支认定。没有许可拿在手里，判 3 年以下，情节严重的判 3 到 7 年。"},{"anchor":"9-11","q":"生活里遇到「无人机」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["买了无人机先实名登记，机场、军事区和城市管制空域不飞，不破解限高","觉得是小事就可以绕过规则","只要别人也这么做，自己就没有责任","事后删掉记录就不会有法律风险"],"why":"没实名登记就飞，罚 200 元以下，情节严重的罚 2000 到 2 万元。没批准在管制空域飞，罚 500 元以下，情节严重的没收无人机，再罚 1000 到 1 万元。"},{"anchor":"9-13","q":"生活里遇到「赌博」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["麻将、扑克可以打，不抽头、不当庄、不组局收钱，不玩网络赌博","觉得是小事就可以绕过规则","只要别人也这么做，自己就没有责任","事后删掉记录就不会有法律风险"],"why":"亲友之间小额打牌，法律不管。从局里抽头、当庄、组局收钱，性质就变了：参与赌博、赌资较大的，拘留 5 日以下或者罚 1000 元以下。"},{"anchor":"9-14","q":"生活里遇到「野味」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["不吃野味，不买卖、不养保护动物当宠物","觉得是小事就可以绕过规则","只要别人也这么做，自己就没有责任","事后删掉记录就不会有法律风险"],"why":"吃国家重点保护动物，东西没收，再按价值罚 2 到 20 倍。收购、运输、出售珍贵濒危动物，判 5 年以下，情节严重的判 5 到 10 年。"},{"anchor":"9-15","q":"生活里遇到「要债」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["要债不扣人、不关人、不跟到家里赖着不让走","觉得是小事就可以绕过规则","只要别人也这么做，自己就没有责任","事后删掉记录就不会有法律风险"],"why":"钱是真欠你的，也不能扣人、关人。法条专门写了：为了讨债扣人、关人，照样按非法拘禁办。"},{"anchor":"9-16","q":"生活里遇到「身份证」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["身份证不借人，不用别人的身份证，也不拿别人的证件登记、开卡、买票","觉得是小事就可以绕过规则","只要别人也这么做，自己就没有责任","事后删掉记录就不会有法律风险"],"why":"把身份证借给、租给、转给别人，警告并罚 200 元以下。冒用别人的身份证，或者用骗领来的，罚 200 到 1000 元，或者拘留 10 日以内。"},{"anchor":"9-17","q":"生活里遇到「警察」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["被警察拦下或带走时配合，不推、不打、不抢执法记录仪，喝了酒更要忍","觉得是小事就可以绕过规则","只要别人也这么做，自己就没有责任","事后删掉记录就不会有法律风险"],"why":"现场阻碍执法，警告或者罚 500 元以下，情节严重的拘留 5 到 10 日。对警察动手是另一档：撕咬、掌掴、踢打、抱摔、扔东西，造成轻微伤以上就算暴力袭警，判 3 年以下。"},{"anchor":"9-19","q":"生活里遇到「打人」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["动手打人前算清这笔账：拘留、赔钱、判刑","觉得是小事就可以绕过规则","只要别人也这么做，自己就没有责任","事后删掉记录就不会有法律风险"],"why":"动手一次的账：拘留 5 到 10 日，加罚 500 到 1000 元。打成轻伤就是刑事案件，判 3 年以下，打成重伤判 3 到 10 年。"},{"anchor":"9-21","q":"生活里遇到「别伪造事故、别夸大损」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["别伪造事故、别夸大损失骗理赔：这是保险诈骗罪，帮你作证、帮你修车、帮你鉴定的人一起算","觉得是小事就可以绕过规则","只要别人也这么做，自己就没有责任","事后删掉记录就不会有法律风险"],"why":"编造事故、夸大损失去骗理赔，是保险诈骗罪，数额较大的判 5 年以下，再罚 1 万到 10 万元。帮你作证、鉴定、评估财产的人故意出假证明，和你一起按共犯定罪。"},{"anchor":"9-24","q":"生活里遇到「汉化漫画、搬运影视剧」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["汉化漫画、搬运影视剧、分享网盘资源和盗版电子书，不收钱也是侵权；挂广告、收会员费就可能判刑","觉得是小事就可以绕过规则","只要别人也这么做，自己就没有责任","事后删掉记录就不会有法律风险"],"why":"别人的作品没经许可翻译了贴出来，或者传到网上，不收钱也是侵权，要删、要赔钱。一挂广告、收会员费，就算为了挣钱。"},{"anchor":"9-25","q":"生活里遇到「二创」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["写同人、做二创拿去出版或卖钱，先取得原作许可，或者把借来的人物名字和关系换成自己的","觉得是小事就可以绕过规则","只要别人也这么做，自己就没有责任","事后删掉记录就不会有法律风险"],"why":"同人哪怕只借了人物名字、性格和关系，拿去出版也可能被判侵权。江南的《此间的少年》借了金庸 60 多个人物，二审判他赔 168 万元，外加 20 万元开支。"},{"anchor":"14-1","q":"准备加强邮箱和支付账号的安全性，应该先做什么？","o":["邮箱、支付、社交账号都开二次验证，优先用手机弹窗确认，其次才是短信验证码","所有账号使用同一个复杂密码","只靠短信验证码，不设置二次验证","给熟人报验证码便于核实"],"why":"二次验证是指登录时除了密码，还要再确认一次是不是本人。用手机上弹个窗、你点一下确认的办法，九成以上的钓鱼盗号都被拦住了。"},{"anchor":"14-2","q":"生活里遇到「邮箱密码」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["邮箱密码单独一个，不和任何网站重复","所有网站共用一个密码更方便","把验证码发给来电的人做身份核实","设备丢失后等几天再处理账号"],"why":"别的网站被偷走的密码，会被人拿来直接登你的邮箱。邮箱一旦被人登进去，凡是能用邮箱找回密码的账号，都跟着一起丢。"},{"anchor":"14-3","q":"生活里遇到「锁屏密码」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["手机设锁屏密码，SIM 卡设 PIN 码","所有网站共用一个密码更方便","把验证码发给来电的人做身份核实","设备丢失后等几天再处理账号"],"why":"SIM 卡就是手机里那张小卡片，短信验证码靠它来收。手机丢了，捡到的人会把这张卡拔下来，插进别的手机收验证码，再挨个重置你的账号。"},{"anchor":"14-4","q":"手机丢了，里面登录了支付和社交账号。你先做什么？","o":["手机丢了按这个顺序做：挂失 SIM 卡、远程锁定、改密码、报警、冻结银行卡","先等捡到的人主动联系","只在社交媒体发寻物启事","买了新手机再处理旧账号"],"why":"顺序比手快更重要。第一步挂失 SIM 卡，验证码这条命脉就断了。"},{"anchor":"14-5","q":"生活里遇到「卡被盗刷先挂失冻结再」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["卡被盗刷先挂失冻结再报警，然后要求银行赔：证明「是你自己刷的」是银行的责任","所有网站共用一个密码更方便","把验证码发给来电的人做身份核实","设备丢失后等几天再处理账号"],"why":"卡被人盗刷，不用你去证明「这不是我刷的」。反过来，是银行要拿出证据证明这笔是你本人刷的，拿不出就得赔你。"},{"anchor":"14-6","q":"生活里遇到「登录设备」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["每隔一段时间看一次账号的登录设备和已授权应用，不用的清掉","所有网站共用一个密码更方便","把验证码发给来电的人做身份核实","设备丢失后等几天再处理账号"],"why":"「登录设备」是指现在还能用你账号的那些手机和电脑。盗号的人常常先潜伏一阵再动手。"},{"anchor":"14-7","q":"生活里遇到「别为了用 App 点」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["别为了用 App 点「全部同意」：不是必需的信息，你不同意也不能拒绝给你服务","所有网站共用一个密码更方便","把验证码发给来电的人做身份核实","设备丢失后等几天再处理账号"],"why":"App 要你的信息，如果不是提供这项服务必须用的，你不同意给，它不能因此不让你用。它能收的，也只限于用得着的那些。"},{"anchor":"14-8","q":"生活里遇到「个人信息」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["你有权查看、复制、更正和删除自己的个人信息，被拒绝可以起诉","所有网站共用一个密码更方便","把验证码发给来电的人做身份核实","设备丢失后等几天再处理账号"],"why":"你有权要求企业让你查看、复制、更正和删除自己的信息。服务停了、保存期限到了、你撤回同意的，企业本来就该自己删掉。"},{"anchor":"14-9","q":"生活里遇到「刷脸」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["刷脸不是必须答应的：有别的办法就不能只让你刷脸，你不同意得给你其他方式","所有网站共用一个密码更方便","把验证码发给来电的人做身份核实","设备丢失后等几天再处理账号"],"why":"只要还有别的办法能办成同一件事，对方就不能只让你刷脸。你不同意刷脸，它得给你刷卡、密码或者身份证这类别的办法，也不许拿「那就办不了业务」来逼你。"},{"anchor":"14-10","q":"生活里遇到「AI 中转站」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["别把代码、密钥和隐私资料交给来路不明的「AI 中转站」，让 AI 自动执行命令时尤其如此","所有网站共用一个密码更方便","把验证码发给来电的人做身份核实","设备丢失后等几天再处理账号"],"why":"中转站夹在你和模型厂商中间，你发出去的内容和收回来的回答，它都看得见、改得了。有研究测了 400 多个中转站，9 个往回答里塞恶意代码，17 个动了研究者故意放进去的云服务密钥。"},{"anchor":"19-1","q":"公司安排了工作日和休息日加班，工资条却没有加班费。你怎么做？","o":["加班费按 1.5 倍、2 倍、3 倍三档算，不给就投诉劳动监察，逾期不付还要加付 50% 到 100%","口头抱怨几句就算维权","公司说调休就完全不用核算","只凭感觉估计金额，不看工时记录"],"why":"平时加班按工资的 1.5 倍给钱。休息日加班又没让你补休，按 2 倍。"},{"anchor":"19-2","q":"生活里遇到「年休假」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["年休假按累计工龄算 5、10、15 天，没休成的按日工资 300% 折钱","只听口头承诺，不保存劳动记录","为了省事直接签字，不看具体文字","遇到争议只在群里抱怨，不走正式渠道"],"why":"在所有单位的工龄加起来满 1 年不满 10 年，每年 5 天年休假。满 10 年是 10 天，满 20 年是 15 天。"},{"anchor":"19-3","q":"生活里遇到「试用期」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["试用期有法定上限、工资不得低于 80%，而且只能约定一次","只听口头承诺，不保存劳动记录","为了省事直接签字，不看具体文字","遇到争议只在群里抱怨，不走正式渠道"],"why":"合同签 1 年以内的，试用期最多 1 个月。签 1 到 3 年的最多 2 个月。"},{"anchor":"19-4","q":"公司通知裁员，给你一份补偿协议。签之前先算什么？","o":["被裁先算清 N：每满一年一个月工资，不满六个月按半个月","只看到账总额，不核对工龄","公司说是惯例就不必计算","被裁时原则上什么补偿都没有"],"why":"被裁时公司要给的经济补偿这样算：干满一年给一个月工资，满半年不满一年按一年算，不满半年给半个月。这里的月工资是走人前 12 个月的平均数，奖金、津贴、补贴都要算进去。"},{"anchor":"19-5","q":"生活里遇到「辞退」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["公司辞退你没提前 30 天通知，还要多付一个月工资","只听口头承诺，不保存劳动记录","为了省事直接签字，不看具体文字","遇到争议只在群里抱怨，不走正式渠道"],"why":"公司因为你病后干不了、干不了工作或者情况大变而辞退你，没有提前 30 天书面通知，要在 N 之外再多给一个月工资，这就是常说的 N+1。谈的时候把这一个月单独列出来，别让公司把它算进 N 里面。"},{"anchor":"19-6","q":"生活里遇到「违法解除」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["公司违法解除的，赔偿金是经济补偿标准的二倍","只听口头承诺，不保存劳动记录","为了省事直接签字，不看具体文字","遇到争议只在群里抱怨，不走正式渠道"],"why":"公司属于违法解除的，赔偿金按经济补偿的标准翻倍，也就是常说的 2N。是不是违法解除要看具体情形。"},{"anchor":"19-7","q":"被辞退时，人事让你签「个人原因主动辞职」。你会怎么做？","o":["不要签「个人原因主动辞职」，那一签就没有 N 了","先签了再谈补偿","签字只是流程，不影响补偿","签了反正还能证明是裁员"],"why":"签字承认「个人原因主动辞职」，经济补偿和失业保险金通常一起落空。自己提出离职，本来就不在给补偿的那几种情形里，公司欠薪、不缴社保这类过错除外。"},{"anchor":"19-8","q":"生活里遇到「离职前把工资条、考勤」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["离职前把工资条、考勤、劳动合同、社保记录和聊天记录先存下来","只听口头承诺，不保存劳动记录","为了省事直接签字，不看具体文字","遇到争议只在群里抱怨，不走正式渠道"],"why":"电脑和账号一交回去，工资条、考勤、合同、社保记录和聊天记录就再也拿不到了。仲裁时工资多少、有没有加班，还是要靠你自己手上的材料。"},{"anchor":"19-9","q":"生活里遇到「职业健康检查」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["进有粉尘、噪声、化学品的岗位之前，先看合同里写没写危害；三次职业健康检查由单位安排并掏钱","只听口头承诺，不保存劳动记录","为了省事直接签字，不看具体文字","遇到争议只在群里抱怨，不走正式渠道"],"why":"签合同时，单位必须把岗位有什么职业病危害、怎么防护、有什么待遇如实写进合同。瞒了你，你可以拒绝干这个活，单位不能因此辞退你。"},{"anchor":"19-10","q":"生活里遇到「粉尘」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["粉尘、噪声、化学毒物造成的损伤不可逆：防护用品单位必须给，没有防护措施的作业可以拒绝","只听口头承诺，不保存劳动记录","为了省事直接签字，不看具体文字","遇到争议只在群里抱怨，不走正式渠道"],"why":"尘肺、噪声聋、化学性眼灼伤都是法定职业病，肺和听力坏了就治不回来。你有权知道岗位有什么危害，有权要单位给防护设施和防护用品。"},{"anchor":"19-11","q":"上班路上被车撞伤，单位说不一定算工伤。你第一步做什么？","o":["上班受伤、上下班路上被撞，第一件事是做工伤认定，单位不报你自己报","先辞职，之后再找证据","等伤好后再考虑申报","只要老板口头答应赔偿就够了"],"why":"上班受伤算工伤。上下班路上被撞、主要责任不在你的，也算工伤。"},{"anchor":"19-12","q":"生活里遇到「别信「撑到工位就算工」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["别信「撑到工位就算工伤」：突发不适先打 120，不是先赶去打卡","只听口头承诺，不保存劳动记录","为了省事直接签字，不看具体文字","遇到争议只在群里抱怨，不走正式渠道"],"why":"突发不适往公司赶，不会让你多拿一笔钱。视同工伤要求人在工作时间、又在工作岗位上发病，路上发病没到岗的本来就不算。"},{"anchor":"19-13","q":"生活里遇到「工伤保险」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["单位没给你交工伤保险，工伤待遇一样有，由单位按同样的标准全额出","只听口头承诺，不保存劳动记录","为了省事直接签字，不看具体文字","遇到争议只在群里抱怨，不走正式渠道"],"why":"单位没给你交工伤保险，工伤待遇一样有。只是改成由单位按同样的项目和标准全额付，一分不少。"},{"anchor":"19-14","q":"生活里遇到「劳动能力鉴定」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["伤情稳定后去做劳动能力鉴定，伤残等级直接换算成钱","只听口头承诺，不保存劳动记录","为了省事直接签字，不看具体文字","遇到争议只在群里抱怨，不走正式渠道"],"why":"伤情稳定之后去做劳动能力鉴定，等级直接换算成钱。一次性伤残补助金按本人工资算：五级 18 个月、六级 16 个月、七级 13 个月、八级 11 个月、九级 9 个月、十级 7 个月。"},{"anchor":"19-15","q":"生活里遇到「工亡」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["工亡的三笔钱要分清：丧葬补助金、供养亲属抚恤金、一次性工亡补助金","只听口头承诺，不保存劳动记录","为了省事直接签字，不看具体文字","遇到争议只在群里抱怨，不走正式渠道"],"why":"因工死亡是三笔钱，别只谈其中一笔。丧葬补助金是当地上年度职工月平均工资的 6 个月。"},{"anchor":"19-16","q":"生活里遇到「在单位长期被欺负、辱」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["在单位长期被欺负、辱骂、刁难，别硬扛：先记下来留证据，再按性质走投诉、报警或者仲裁","只听口头承诺，不保存劳动记录","为了省事直接签字，不看具体文字","遇到争议只在群里抱怨，不走正式渠道"],"why":"在单位被欺负的人，后来得心脏病、中风的风险高约六成，被欺负得越多风险越高。被欺负的人几年后冒出自杀念头的几率约是别人的两倍。"},{"anchor":"19-17","q":"生活里遇到「离职证明」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["离职时找单位要一份离职证明，写明合同期限、离职日期、岗位和工作年限","只听口头承诺，不保存劳动记录","为了省事直接签字，不看具体文字","遇到争议只在群里抱怨，不走正式渠道"],"why":"不管是被辞退、合同到期还是自己辞职，单位都要在你离职时给一份离职证明，并在 15 天内转走档案和社保。证明上要写合同期限、离职日期、岗位和在这家干了几年。"},{"anchor":"19-18","q":"生活里遇到「离职补偿」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["拿到离职补偿先看个税：当地上年职工平均工资 3 倍以内免税，超出的部分单独算，不并进当年工资","只听口头承诺，不保存劳动记录","为了省事直接签字，不看具体文字","遇到争议只在群里抱怨，不走正式渠道"],"why":"因为解除劳动合同拿到的一次性补偿，在当地上年职工平均工资 3 倍以内的部分不交个税。超出的部分单独算税，不和当年工资加在一起。"},{"anchor":"19-19","q":"生活里遇到「换城市工作时」相关的选择，朋友给了几种说法。哪种做法更符合指南？","o":["换城市工作时，把养老和医保关系转到新参保地，缴费年限接着累计，别办退保","只听口头承诺，不保存劳动记录","为了省事直接签字，不看具体文字","遇到争议只在群里抱怨，不走正式渠道"],"why":"换城市工作，养老和医保关系都能跟着你走，以前交的年限接着往上加。没到领养老金的年龄，不能办退保把钱取出来。"}]};</script>

const REWARDS=CARD_DATA.slice(2).map(x=>x[0]);
const RARITY_ZH={common:'普通',rare:'稀有',epic:'史诗',legendary:'传说'};
const RELICS=[

let S;
function fresh(){return{phase:'intro',act:0,floor:0,route:[],talent:null,hp:70,maxHp:70,atk:0,def:0,deck:[...Array(5).fill({id:'say',up:false}),...Array(4).fill({id:'belt',up:false})],relics:[],score:0,correct:0,asked:0,streak:0,best:0,totalDamage:0,missed:[],questions:{1:[],2:[],3:[]},battle:null,checkpoint:null,seq:0}}
function copy(x){return JSON.parse(JSON.stringify(x))}
function hasRelic(id){return S.relics.includes(id)}
function heal(n){S.hp=clamp(S.hp+n,0,S.maxHp)}
function gainMax(n){S.maxHp+=n;heal(n)}
function activeAttack(){let n=S.atk+(S.battle?.buff.atk||0);if(hasRelic('blanket')&&S.hp<S.maxHp/2)n+=3;return n}
function activeDefense(){return S.def+(S.battle?.buff.def||0)}
function mapRoute(){const pick=a=>shuffle(a).slice(0,2);return[['battle'],pick(['battle','station','chest']),['elite','battle'],pick(['battle','station','chest']),['rest'],['boss']]}
const NODE_CHAR={battle:'战',elite:'精',station:'问',chest:'宝',rest:'休',boss:'王'};
const NODE_NAME={battle:'普通战斗',elite:'精英战',station:'问答驿站',chest:'宝箱',rest:'休息点',boss:'幕末 Boss'};
function drawQuestion(){const pool=QUESTIONS[S.act+1],key=String(S.act+1);if(!S.questions[key].length)S.questions[key]=shuffle(pool.map((_,i)=>i));const q=pool[S.questions[key].pop()];return {...q,order:shuffle([0,1,2,3]),chosen:null}}
function startGame(t){S=fresh();const tal=TALS[t];S.talent=t;S.atk=tal.atk;S.def=tal.def;S.maxHp=tal.max;S.hp=tal.max;startAct()}
function startAct(){S.route=mapRoute();S.floor=0;S.phase='map';S.checkpoint=null;S.checkpoint=copy({...S,checkpoint:null});scene.setAct(S.act);render()}
function chooseNode(type){if(S.phase!=='map'||!S.route[S.floor].includes(type))return;if(type==='battle'||type==='elite'||type==='boss')startBattle(type);else if(type==='station'){S.phase='station';S.question=drawQuestion();render()}else if(type==='chest'){S.phase='chest';grantRelic();render()}else{S.phase='rest';render()}}
function advance(){S.floor++;if(S.floor>=6){S.act++;if(S.act>=3){S.phase='win';scene.ending();render();return}startAct();return}S.phase='map';render()}
function grantRelic(){const candidates=RELICS.filter(x=>!hasRelic(x[0]));if(!candidates.length){heal(8);S.lastRelic={name:'补给箱',desc:'恢复 8 生命'};return}const r=candidates[rand(candidates.length)];S.relics.push(r[0]);S.lastRelic=RELIC_BY_ID[r[0]];if(r[0]==='salt')gainMax(10)}
function stationAnswer(index){if(S.phase!=='station'||S.question.chosen!==null)return;let q=S.question;const ok=q.order[index]===0;q.chosen=index;scoreAnswer(q,ok);if(!ok){takeDamage(6,true);if(S.hp<=0){die();return}}S.phase='station-result';render()}
function stationReward(kind){if(S.phase!=='station-result'||S.question.order[S.question.chosen]!==0)return;if(kind==='atk')S.atk++;else if(kind==='def')S.def++;else if(kind==='hp')gainMax(8);else return;advance()}
function rest(kind,index){if(kind==='heal'&&S.phase==='rest'){heal(Math.ceil(S.maxHp*.3)+(hasRelic('fund')?10:0));advance()}else if(kind==='upgrade'){if(index==null&&S.phase==='rest'){S.phase='upgrade';render()}else if(S.phase==='upgrade'&&S.deck[index]&&!S.deck[index].up){S.deck[index].up=true;advance()}}}
function startBattle(kind){let enemyIndex=kind==='boss'?4:kind==='elite'?3:rand(3),base=ACTS[S.act].enemies[enemyIndex];S.phase='battle';S.battle={kind,enemy:{name:base[0],maxHp:base[1],hp:base[1],armor:0,weak:0,vuln:0,charge:0,intents:base[2],intentIndex:0,color:ACTS[S.act].mon,shape:enemyIndex},armor:hasRelic('belt')?8:0,weak:0,vuln:0,energy:0,draw:shuffle(S.deck.map(copy)),discard:[],hand:[],exhaust:[],turn:0,answered:false,question:null,buff:{atk:hasRelic('index')?1:0,def:0,evidence:0,risk:0,scam:0,life:0,learn:0},firstHit:false};if(hasRelic('report'))S.battle.enemy.vuln=2;scene.setEnemy(base[0],enemyIndex,ACTS[S.act].mon);startTurn()}
function drawCards(n){const b=S.battle;for(let i=0;i<n;i++){if(!b.draw.length){if(!b.discard.length)break;b.draw=shuffle(b.discard);b.discard=[]}b.hand.push(b.draw.pop())}}
function startTurn(){const b=S.battle;b.turn++;b.armor=0;b.firstHit=false;b.energy=0;if(b.buff.life){b.buff.atk++;b.buff.def++}if(b.buff.risk)b.armor+=b.buff.risk;drawCards(5+(b.turn===1&&hasRelic('alarm')?2:0));b.answered=false;b.question=drawQuestion();render()}
function scoreAnswer(q,ok){S.asked++;if(ok){S.correct++;S.streak++;S.best=Math.max(S.best,S.streak);S.score+=100+Math.min(100,(S.streak-1)*20)}else{S.streak=0;S.missed.push({anchor:q.anchor,q:q.q,correct:q.o[0]})}}
function battleAnswer(index){if(S.phase!=='battle'||S.battle.answered)return;const b=S.battle,q=b.question,ok=q.order[index]===0;q.chosen=index;b.answered=true;scoreAnswer(q,ok);b.energy=ok?TALS[S.talent].energy:1;if(ok){b.energy+=b.buff.learn+(hasRelic('calendar')&&S.streak>=3?1:0);if(b.buff.evidence)b.buff.atk+=b.buff.evidence}render()}
function gainArmor(n){const b=S.battle,amount=Math.max(0,n+activeDefense());b.armor+=amount;scene.pop('+'+amount+' 护甲','#74c8ff','hero');return amount}
function attack(n,times=1){const b=S.battle,e=b.enemy;for(let i=0;i<times;i++){if(e.hp<=0)break;let d=Math.max(0,n+activeAttack());if(b.weak)d=Math.floor(d*.75);if(e.vuln)d=Math.ceil(d*1.5);const blocked=Math.min(e.armor,d);e.armor-=blocked;d-=blocked;e.hp=Math.max(0,e.hp-d);S.totalDamage+=d;scene.attack(d,e.color);if(e.hp<=0){winBattle();break}}}
function takeDamage(n,raw=false){const b=S.battle;let d=n;if(!raw){if(b.enemy.charge)d+=b.enemy.charge*3;if(b.enemy.weak)d=Math.floor(d*.75);if(b.vuln)d=Math.ceil(d*1.5);if(hasRelic('verify')&&!b.firstHit)d=Math.max(0,d-5);b.firstHit=true}let block=!raw&&b?Math.min(b.armor,d):0;if(b&&!raw)b.armor-=block;d-=block;S.hp=Math.max(0,S.hp-d);scene.hit(d);if(!raw&&b.buff.scam){let r=b.buff.scam;let shield=Math.min(b.enemy.armor,r);b.enemy.armor-=shield;r-=shield;b.enemy.hp=Math.max(0,b.enemy.hp-r);S.totalDamage+=r;if(b.enemy.hp<=0)winBattle()}if(S.hp<=0)die()}
function cardNum(card){let base=CARDS[card.id].amount;return base+(card.up?(CARDS[card.id].type==='power'?1:CARDS[card.id].type==='skill'?2:3):0)}
function cardDesc(card){const id=card.id,n=cardNum(card),atk=S.phase==='battle'?activeAttack():S.atk,def=S.phase==='battle'?activeDefense():S.def,a=x=>`<em>${x}</em>`;switch(id){
 case 'say':case 'stop':case 'walk':return `造成 ${a(n+atk)} 伤害。`;
 case 'freeze':return `造成 ${a(n+atk)} 伤害，抽 1 张牌。`;
 case 'expose':return `造成 ${a(n+atk)} 伤害 ×3。`;
 case 'proof':return `造成 ${a(n+atk)} 伤害，施加 2 层易伤。`;
 case 'compound':return `造成 ${a(n*S.streak+atk)} 伤害（${n} × 连对数）。`;
 case 'arbitrate':return `造成等于当前护甲${card.up?' +3':''} 的 ${a((S.phase==='battle'?S.battle.armor:0)+(card.up?3:0)+atk)} 伤害。`;
 case 'escape':return `造成 ${a(n+atk)} 伤害，获得 ${a(10+def)} 护甲。`;
 case 'belt':case 'reserve':return `获得 ${a(n+def)} 护甲。`;
 case 'pause':case 'warn':return `获得 ${a(n+def)} 护甲，抽 1 张牌。`;
 case 'split':return `获得 ${a(n+def)} 护甲 ×3。`;
 case 'read':return `抽 ${a(n)} 张牌。`;
 case 'sleep':return `恢复 ${a(n)} 生命。消耗。`;
 case 'check':return `施加 ${a(n)} 层易伤，抽 1 张牌。`;
 case 'sugar':return `施加 ${a(n)} 层虚弱，获得 ${a(4+def)} 护甲。`;
 case 'call':return `恢复 ${a(n)} 生命，获得 ${a(10+def)} 护甲。消耗。`;
 case 'nap':return `获得 ${a(n)} 能量。消耗。`;
 case 'steps':return `本场攻击力 +${a(n)}。`;
 case 'train':return `本场防御力 +${a(n)}。`;
 case 'evidence':return `本场每次答对，攻击力 +${a(n)}。`;
 case 'risk':return `每回合开始获得 ${a(n)} 护甲。`;
 case 'scam':return `每次被攻击反伤 ${a(n)}。`;
 case 'life':return `每回合攻击力、防御力各 +${a(n)}。`;
 case 'learn':return `答对额外获得 ${a(n)} 能量。`;
}}
function playCard(index){if(S.phase!=='battle')return;const b=S.battle;if(!b.answered||!b.hand[index])return;const card=b.hand[index],data=CARDS[card.id];if(data.cost>b.energy)return;b.energy-=data.cost;b.hand.splice(index,1);const n=cardNum(card),id=card.id;if(data.type==='attack'){
 if(id==='expose')attack(n,3);else if(id==='compound')attack(n*S.streak);else if(id==='arbitrate')attack(b.armor+(card.up?3:0));else attack(n);
 if(S.phase==='battle'){if(id==='freeze')drawCards(1);if(id==='proof')b.enemy.vuln+=2;if(id==='escape')gainArmor(10+(card.up?3:0))}
 }else if(data.type==='defense'){if(id==='split')for(let i=0;i<3;i++)gainArmor(n);else gainArmor(n);if(id==='pause'||id==='warn')drawCards(1)}
 else if(data.type==='skill'){if(id==='read')drawCards(n);if(id==='sleep'||id==='call')heal(n);if(id==='check'){b.enemy.vuln+=n;drawCards(1)}if(id==='sugar'){b.enemy.weak+=n;gainArmor(4+(card.up?2:0))}if(id==='call')gainArmor(10+(card.up?2:0));if(id==='nap')b.energy+=n}
 else{if(id==='steps')b.buff.atk+=n;if(id==='train')b.buff.def+=n;if(id==='evidence')b.buff.evidence+=n;if(id==='risk')b.buff.risk+=n;if(id==='scam')b.buff.scam+=n;if(id==='life')b.buff.life+=n;if(id==='learn')b.buff.learn+=n}
 if(S.phase==='battle'){if(['sleep','call','nap'].includes(id))b.exhaust.push(card);else b.discard.push(card);render()}}
function intent(){const e=S.battle.enemy;let [type,val]=e.intents[e.intentIndex%e.intents.length].split(':');let [n,times]=val.split('x').map(Number);return{type,n,times:times||1}}
function intentText(){const a=intent(),e=S.battle.enemy;if(a.type==='attack'){let n=a.n+e.charge*3;if(e.weak)n=Math.floor(n*.75);return `攻击 ${n}${a.times>1?' × '+a.times:''}`}if(a.type==='block')return `加护甲 ${a.n}`;if(a.type==='charge')return '蓄力：下次攻击增强';return `${a.type==='weak'?'施加虚弱':'施加易伤'} ${a.n} 层`}
function endTurn(){if(S.phase!=='battle'||!S.battle.answered)return;const b=S.battle;b.discard.push(...b.hand);b.hand=[];if(b.weak)b.weak--;if(b.vuln)b.vuln--;const e=b.enemy;const a=intent();e.armor=0;if(a.type==='attack'){for(let i=0;i<a.times&&S.phase==='battle';i++)takeDamage(a.n);e.charge=0}else if(a.type==='block')e.armor+=a.n;else if(a.type==='charge')e.charge+=a.n;else if(a.type==='weak')b.weak+=a.n;else if(a.type==='vuln')b.vuln+=a.n;if(e.weak)e.weak--;if(e.vuln)e.vuln--;e.intentIndex++;if(S.phase==='battle')startTurn()}
function winBattle(){const b=S.battle;if(!b||S.phase!=='battle')return;scene.death(b.enemy.color);heal(TALS[S.talent].winHeal+(hasRelic('jar')?6:0));S.phase='reward';S.reward=drawRewards(b.kind==='elite'||b.kind==='boss');render()}
function drawRewards(elite){const weights=elite?{common:15,rare:36,epic:34,legendary:15}:{common:48,rare:33,epic:16,legendary:3};const choices=[];while(choices.length<4){let total=Object.values(weights).reduce((a,b)=>a+b,0),r=rand(total),rarity;for(const [k,w] of Object.entries(weights)){r-=w;if(r<0){rarity=k;break}}let candidates=REWARDS.filter(id=>CARDS[id].rarity===rarity&&!choices.includes(id));if(!candidates.length)candidates=REWARDS.filter(id=>!choices.includes(id));choices.push(candidates[rand(candidates.length)])}return choices}
function takeReward(id){if(S.phase!=='reward')return;if(id&&S.reward.includes(id))S.deck.push({id,up:false});else if(id)return;advance()}
function die(){if(S.phase==='dead'||S.phase==='win')return;S.phase='dead';scene.fall();render()}
function restartAct(){if(S.phase!=='dead'||!S.checkpoint)return;let saved=copy(S.checkpoint);S=saved;S.checkpoint=copy({...S,checkpoint:null});scene.reset();scene.setAct(S.act);render()}

function cardHTML(item,idx,context='reward'){
 const c=CARDS[item.id],n=cardNum(item),playable=context==='hand'&&S.battle.answered&&c.cost<=S.battle.energy;
 return `<button class="card ${c.type} ${playable?'playable':''}" type="button" data-action="${context==='hand'?'play':'reward'}" data-id="${c.id}" data-index="${idx}" ${context==='hand'&&!playable?'disabled':''} aria-label="${esc(c.name)}，${c.cost} 费"><span class="card-head"><span class="cost">${c.cost}</span><span class="rarity ${c.rarity}" title="${RARITY_ZH[c.rarity]}"></span></span><span class="art">${c.icon}</span><span class="card-name">${esc(c.name)}${item.up?'+':''}</span><span class="card-desc">${cardDesc(item)}</span><span class="card-meta">${{attack:'攻击',defense:'防御',skill:'技能',power:'能力'}[c.type]} · ${RARITY_ZH[c.rarity]}</span></button>`
}
function questionHTML(q,answered,station=false){
 const result=answered?`<div class="explain"><strong>${q.order[q.chosen]===0?'答对了！':'答错了。'}</strong> ${esc(q.why)} <a href="${link(q.anchor)}" target="_blank" rel="noopener noreferrer">原文：第 ${q.anchor.replace('-', ' 节第 ')} 条 ↗</a></div>`:'';
 return `<div class="quiz"><strong>${esc(q.q)}</strong><div class="options">${q.order.map((oi,i)=>`<button class="answer ${answered?(oi===0?'correct':i===q.chosen?'wrong':''):''}" type="button" data-action="${station?'station-answer':'answer'}" data-index="${i}" ${answered?'disabled':''}><b>${i+1}</b>${esc(q.o[oi])}</button>`).join('')}</div>${result}</div>`
}
function renderMap(){const map=$('map');map.innerHTML=S.route.length?S.route.map((nodes,i)=>`<div class="map-floor">${nodes.map(n=>`<span class="map-node ${i<S.floor?'done':i===S.floor?'now':''}" title="第 ${i+1} 层 · ${NODE_NAME[n]}">${NODE_CHAR[n]}</span>`).join('')}</div>`).join(''):'';$('mapHint').textContent=S.phase==='map'?'选择下一站':S.phase==='battle'?'战斗中':S.phase==='win'?'旅程完成':`第 ${S.floor+1} 层`}
function renderHud(){const a=ACTS[S.act]||ACTS[2];$('hpNum').textContent=`${S.hp} / ${S.maxHp}`;$('hpFill').style.width=`${100*S.hp/S.maxHp}%`;$('scoreNum').textContent=S.score;$('streakNum').textContent=`连对 ${S.streak} · 最长 ${S.best}`;$('actNum').textContent=`第${['一','二','三'][S.act]||'三'}幕 · ${a.name}`;$('floorNum').textContent=`第 ${Math.min(6,S.floor+1)} / 6 层`;let b=S.battle,show=['battle','reward','dead'].includes(S.phase)&&b;
 $('enemyHud').hidden=!show;$('playerHud').hidden=!show;
 if(show){let e=b.enemy;$('enemyHud').innerHTML=`<div class="unit-name">${esc(e.name)}</div><div class="unit-line"><b class="unit-hp">生命 ${e.hp}/${e.maxHp}</b><b class="unit-armor">护甲 ${e.armor}</b></div><div class="unit-line unit-status">${e.weak?`虚弱 ${e.weak}　`:''}${e.vuln?`易伤 ${e.vuln}`:''}</div><div class="intent">下回合意图：${S.phase==='battle'?intentText():'已击败'}</div>`;

const scene=(()=>{
 const cv=$('scene'),ctx=cv.getContext('2d');

"..BBBBBBBB..",".SBBBBBBBBS.",".SBBYBBBBBS.","..BBBBBBBB..","..PPPPPPPP..","..PPP..PPP.."];
  const LEG=[["..PPP..PPP..","..KK....KK.."],[".PPP....PPP.",".KK......KK."]];
  const SUIT=[
"..BBBBBBBB..",".SBBWRRWBBS.",".SBBWRRWBBS.","..BBBRRBBB.."];
  const MON=[

 let w=0,h=0,p=4,act=0,enemy=null,ended=false,fallen=false,shake=0,heroRush=0,enemyRush=0,heroFlash=0,enemyFlash=0,death=[],particles=[],pops=[];

 function sprite(g,pal,x,y,scale=p){for(let row=0;row<g.length;row++)for(let col=0;col<g[row].length;col++){const ch=g[row][col];if(ch!=='.'&&pal[ch]){ctx.fillStyle=pal[ch];ctx.fillRect(Math.round(x+col*scale),Math.round(y+row*scale),Math.ceil(scale),Math.ceil(scale))}}}

 const gy=h*.79;ctx.fillStyle=ended?'#e58a6c':a.hill;for(let x=0;x<w+p;x+=p){let hill=h*.16+Math.sin(x/39)*h*.03+Math.sin(x/91)*h*.04;ctx.fillRect(x,gy-hill,p,hill)}ctx.fillStyle=ended?'#7a4a3a':a.ground;ctx.fillRect(0,gy,w,h-gy);ctx.fillStyle=ended?'#f0b35a':'#7ca482';ctx.fillRect(0,gy,w,p*2);ctx.fillStyle='#161a3155';for(let x=0;x<w;x+=p*8)ctx.fillRect(x,gy+p*5,p*3,p)}

 function drawEnd(t,gy){sprite(HOUSE,{R:'#c8463a',W:'#fff3dc',G:'#7cc6f2',D:'#6b4a2c'},w*.62,gy-HOUSE.length*p*1.45,p*1.45);ctx.fillStyle='#ffd84a';ctx.fillRect(w*.28-p*2,gy-p*6,p*16,p*6);ctx.fillStyle='#c79b1e';ctx.fillRect(w*.28-p*2,gy-p*2,p*16,p*2);drawHero(w*.28,gy-p*6-(reduced?0:Math.abs(Math.sin(t/250))*p),true,t);ctx.font=`${Math.max(22,p*6)}px "ZCOOL KuaiLe"`;ctx.textAlign='center';ctx.fillStyle='#3a2a22';ctx.fillText('人生赢家',w*.5+2,h*.13+2);ctx.fillStyle='#fff';ctx.fillText('人生赢家',w*.5,h*.13);if(!reduced&&Math.random()<.03)burst(w*(.15+Math.random()*.7),h*(.15+Math.random()*.25),['#ffd84a','#ff6475','#74c8ff','#5fd49b'],15)}

 if(death.length){for(const o of death){o.x+=o.vx;o.y+=o.vy;o.vy+=.09;o.life-=.02;ctx.globalAlpha=Math.max(0,o.life);ctx.fillStyle=o.c;ctx.fillRect(o.x,o.y,p*2,p*2)}death=death.filter(o=>o.life>0);ctx.globalAlpha=1}
 if(particles.length){for(const o of particles){o.x+=o.vx;o.y+=o.vy;o.vy+=.08;o.life-=.02;ctx.globalAlpha=Math.max(0,o.life);ctx.fillStyle=o.c;ctx.fillRect(o.x,o.y,p,p)}particles=particles.filter(o=>o.life>0);ctx.globalAlpha=1}
 if(pops.length){for(const o of pops){let k=(t-o.at)/1000;ctx.globalAlpha=Math.max(0,1-k);ctx.font=`${Math.max(14,p*4)}px "ZCOOL KuaiLe"`;ctx.textAlign='center';ctx.fillStyle='#0b0e1f';ctx.fillText(o.text,o.x+2,o.y-k*35+2);ctx.fillStyle=o.color;ctx.fillText(o.text,o.x,o.y-k*35)}pops=pops.filter(o=>t-o.at<1000);ctx.globalAlpha=1}if(shaking)ctx.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);
 return{setAct(i){act=i;ended=false;fallen=false;enemy=null;death=[]},setEnemy(name,shape,color){enemy={name,shape,color};death=[];fallen=false;ended=false},pop(text,color,who){if(!reduced)pops.push({text,color,x:w*(who==='hero'?.3:.72),y:h*.44,at:performance.now()})},attack(n,color){const t=performance.now();heroRush=t+240;enemyFlash=t+320;shake=reduced?0:7;this.pop('-'+n,'#ffdf72','enemy');if(n>0)burst(w*.73,h*.53,[color,'#fff','#ffd84a'],10)},hit(n){const t=performance.now();enemyRush=t+240;heroFlash=t+320;shake=reduced?0:8;this.pop('-'+n,'#ff6475','hero')},death(color){const x=w*.71,y=h*.6;enemy=null;if(!reduced){for(let i=0;i<32;i++){let a=Math.random()*Math.PI*2,v=1+Math.random()*4;death.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,c:i%2?color:'#fff',life:1})}}},fall(){fallen=true},ending(){ended=true;enemy=null;fallen=false;burst(w*.5,h*.25,['#ffd84a','#fff','#ff6475'],50)},reset(){ended=false;fallen=false;enemy=null;particles=[];pops=[];death=[]}}
})();

function dispatch(action,id,index){switch(action){
 case 'open-talents':S.phase='talents';render();break;
 case 'talent':startGame(index);break;
 case 'node':chooseNode(id);break;
 case 'answer':battleAnswer(index);break;
 case 'station-answer':stationAnswer(index);break;
 case 'play':playCard(index);break;
 case 'reward':takeReward(id);break;
 case 'skip':takeReward(null);break;
 case 'station-reward':stationReward(id);break;
 case 'advance':advance();break;
 case 'rest-heal':rest('heal');break;
 case 'rest-upgrade':rest('upgrade');break;
 case 'upgrade':rest('upgrade',index);break;
 case 'back-rest':S.phase='rest';render();break;
 case 'retry-act':restartAct();break;
 case 'restart':S=fresh();scene.reset();scene.setAct(0);render();break;
 case 'close-help':S.help=false;render();break;
 }}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)dispatch(b.dataset.action,b.dataset.id,Number(b.dataset.index))});
$('endTurn').addEventListener('click',endTurn);
$('help').addEventListener('click',()=>{S.help=!S.help;render()});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.matches('input,textarea'))return;let n=Number(e.key);if(n>=1&&n<=9){if(S.phase==='battle'){if(!S.battle.answered&&n<=4)battleAnswer(n-1);else if(S.battle.answered)playCard(n-1)}else if(S.phase==='station'&&n<=4)stationAnswer(n-1)}else if(e.key.toLowerCase()==='e'&&S.phase==='battle')endTurn()});
S=fresh();render();
window.__game={state:()=>S,chooseTalent:startGame,chooseNode,battleAnswer,playCard,endTurn,takeReward,stationAnswer,stationReward,rest,advance,restartAct,restart:()=>{S=fresh();scene.reset();scene.setAct(0);render()},cards:CARDS,questions:QUESTIONS};
</script>
